      for(let x=0; x<maxCols; x++){
        if(!occupied(parentId, x, y, null)) return {x,y};
      }
    }
    return {x:0,y:0};
  }

  function nearestFreeSlot(parentId, targetX, targetY, excludeId){
    if(!occupied(parentId, targetX, targetY, excludeId)) return {x: Math.max(0,targetX), y: Math.max(0,targetY)};
    let best = null, bestDist = Infinity;
    for(let y=0; y<40; y++){
      for(let x=0; x<40; x++){
        if(occupied(parentId, x, y, excludeId)) continue;
        const d = Math.hypot(x-targetX, y-targetY);
        if(d < bestDist){ bestDist = d; best = {x,y}; }
      }
    }
    return best || {x:0,y:0};
  }

  /* ============ ACCESSIBILITY: labels + roving tabindex ============ */
  function ariaLabelFor(item){
    if(item.type === "folder") return `Folder: ${item.label}`;
    if(item.type === "app" || item.type === "webapp") return `App: ${item.label}`;
    return `Bookmark: ${item.label}`;
  }

  /* ============ WEB APP ENRICHMENT (best-effort manifest detection) ============
     There's no browser API that lets a page enumerate installed PWAs — that's
     a real, permanent limitation (privacy/security, not an oversight). What IS
     achievable: given a URL, try to fetch its web app manifest directly and
     pull the real name/icon/theme color from it. This works for sites that
     serve a permissive CORS header on their manifest; it silently does
     nothing otherwise, leaving the favicon-chain icon already in place. */
  async function tryEnrichWebApp(item){
    let origin;
    try{ origin = new URL(item.url).origin; }catch(e){ return; }
    const candidates = ["/manifest.json", "/manifest.webmanifest", "/site.webmanifest"];
    for(const path of candidates){
      const manifestUrl = origin + path;
      try{
        const res = await fetch(manifestUrl, { mode:"cors" });
        if(!res.ok) continue;
        const manifest = await res.json();
        const current = state.icons.find(i=>i.id===item.id);
        if(!current) return; // item was deleted before this resolved

        const icons = Array.isArray(manifest.icons) ? manifest.icons : [];
        let bestIcon = null, bestSize = -1;
        icons.forEach(ic=>{
          const sizeStr = (ic.sizes || "").split(" ")[0] || "";
          const size = parseInt(sizeStr.split("x")[0], 10) || 0;
          if(size > bestSize && size <= 512){ bestSize = size; bestIcon = ic; }
        });
        if(!bestIcon && icons.length > 0) bestIcon = icons[0];
        if(bestIcon && bestIcon.src){
          try{ current.manifestIcon = new URL(bestIcon.src, manifestUrl).href; }catch(e){}
        }
        if((manifest.short_name || manifest.name) && current.metadata && current.metadata.autoLabel){
          current.label = manifest.short_name || manifest.name;
        }
        if(manifest.theme_color){ current.themeColor = manifest.theme_color; }

        save();
        render();
        return; // first manifest that actually resolves wins
      }catch(e){
        // CORS block, 404, invalid JSON, network failure — try the next path
      }
    }
  }

  // Roving tabindex: exactly one icon per container is a Tab stop at a time
  // (the last one that had keyboard/pointer focus); all others are tabindex=-1
  // so Tab moves in and out of the grid in one step instead of one-per-icon.
  let focusedIconId = null;
  function getRovingId(items){
    if(items.length === 0) return null;
    if(focusedIconId && items.some(i=>i.id===focusedIconId)) return focusedIconId;
    return items[0].id;
  }

  function nearestInDirection(items, current, dir){
    const candidates = items.filter(i=>i.id!==current.id);
    let pool;
    if(dir==="right") pool = candidates.filter(i=>i.y===current.y && i.x>current.x).sort((a,b)=>a.x-b.x);
    else if(dir==="left") pool = candidates.filter(i=>i.y===current.y && i.x<current.x).sort((a,b)=>b.x-a.x);
    else if(dir==="down") pool = candidates.filter(i=>i.x===current.x && i.y>current.y).sort((a,b)=>a.y-b.y);
    else if(dir==="up") pool = candidates.filter(i=>i.x===current.x && i.y<current.y).sort((a,b)=>b.y-a.y);
    if(pool && pool.length) return pool[0].id;

    // No exact same row/column — fall back to nearest icon generally in that direction.
    let general = candidates.filter(i=>{
      if(dir==="right") return i.x>current.x;
      if(dir==="left") return i.x<current.x;
      if(dir==="down") return i.y>current.y;
      if(dir==="up") return i.y<current.y;
      return false;
    });
    if(general.length===0) return null;
    general.sort((a,b)=>
      (Math.abs(a.x-current.x)+Math.abs(a.y-current.y)) - (Math.abs(b.x-current.x)+Math.abs(b.y-current.y))
    );
    return general[0].id;
  }

  function handleIconGridKeydown(e, parentId){
    if(e.target.isContentEditable) return; // renaming a label — let its own keydown handler (Enter/Escape) own this keystroke
    const el = e.target.closest(".icon");
    if(!el) return;
    const items = childrenOf(parentId);
    const current = items.find(i=>i.id===el.dataset.id);
    if(!current) return;

    const dirMap = { ArrowRight:"right", ArrowLeft:"left", ArrowDown:"down", ArrowUp:"up" };
    if(dirMap[e.key]){
      e.preventDefault();
      const nextId = nearestInDirection(items, current, dirMap[e.key]);
      if(!nextId) return;
      const container = parentId===null ? gridLayer : folderBody;
      const nextEl = container.querySelector(`.icon[data-id="${nextId}"]`);
      if(nextEl){
        el.tabIndex = -1;
        nextEl.tabIndex = 0;
        focusedIconId = nextId;
        nextEl.focus();
      }
    }else if(e.key === "Enter" || e.key === " "){
      e.preventDefault();
      const item = state.icons.find(i=>i.id===current.id);
      if(item) openItem(item);
    }
  }

  /* ============ RENDER ============ */
  function renderInto(container, parentId, opts){
    opts = opts || {};
    // clear icons but keep rubberband if root
    Array.from(container.querySelectorAll(".icon")).forEach(n=>n.remove());
    const items = childrenOf(parentId).sort((a,b)=> a.y-b.y || a.x-b.x);
    const cell = getCellSize();
    const offset = getGridOffset(parentId);
    const rovingId = getRovingId(items);

    items.forEach(item=>{
      const el = document.createElement("div");
      el.className = "icon" + (selected.has(item.id) ? " selected" : "");
      el.dataset.id = item.id;
      el.setAttribute("role", "button");
      el.setAttribute("aria-label", ariaLabelFor(item));
      el.tabIndex = (item.id === rovingId) ? 0 : -1;
      el.style.left = (item.x*cell.w + offset.left) + "px";
      el.style.top = (item.y*cell.h + offset.top) + "px";
      const checkHTML = multiSelectMode
        ? `<div class="select-check${selected.has(item.id) ? " checked" : ""}">${menuIcon("check")}</div>`
        : "";
      el.innerHTML = `${checkHTML}${glyphFor(item)}<div class="icon-label" data-id="${item.id}">${escapeHtml(item.label)}</div>`;
      container.appendChild(el);
      wireIconEvents(el, item, parentId);
    });
    if(typeof updateCutVisualState === "function") updateCutVisualState();

    if(parentId === null){
      const maxY = items.reduce((m,i)=> Math.max(m,i.y), -1);
      const neededHeight = offset.top + (maxY+1)*cell.h + 100;
      gridLayer.style.minHeight = Math.max(neededHeight, window.innerHeight) + "px";
      emptyHint.style.display = items.length === 0 ? "block" : "none";
      updateStatusBar();
      if(typeof applyAppSearch === "function" && searchMode === "app" && searchInput && searchInput.value){
        applyAppSearch(searchInput.value);
      }
    }else{
      if(multiSelectMode) updateStatusBar();
      const maxYf = items.reduce((m,i)=> Math.max(m,i.y), -1);
      const neededHf = offset.top + (maxYf+1)*cell.h + 40;
      // folderBody sits inside folderPanel, which has a FIXED height and
      // overflow:hidden — growing folderBody's own min-height past that
      // just gets clipped by the panel, it does not create an internally
      // scrollable area. A normal-flow spacer (unlike the absolutely
      // positioned icons, which never contribute to scrollHeight) signals
      // the true content extent so folderBody's own overflow:auto can
      // actually scroll to it, without folderBody growing past its
      // flex-allotted space in the first place.
      let spacer = container.querySelector(".scroll-spacer");
      if(!spacer){
        spacer = document.createElement("div");
        spacer.className = "scroll-spacer";
        spacer.style.cssText = "position:relative; width:1px; pointer-events:none;";
        container.appendChild(spacer);
      }
      spacer.style.height = Math.max(0, neededHf) + "px";
      const hint = folderBody.querySelector(".empty-hint");
      if(items.length === 0){
        if(!hint){
          const h = document.createElement("div");
          h.className = "empty-hint";
          h.textContent = "This folder is empty. Right-click to add something.";
          container.appendChild(h);
        }
      }else if(hint){ hint.remove(); }
    }
  }

  function render(){
    renderInto(gridLayer, null);
    if(currentFolderId !== null){
      renderInto(folderBody, currentFolderId);
    }
  }

  function escapeHtml(s){
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  /* ============ SELECTION ============ */
  function clearSelection(){ selected.clear(); render(); }

  function selectOnly(id){ selected = new Set([id]); render(); }

  // Non-destructive selection update: toggles .selected on whatever icon
  // elements already exist, without tearing any of them down and rebuilding
  // — unlike render()/selectOnly(), which remove and recreate every icon
  // node. Needed specifically where a selection change happens mid-gesture
  // (see wireIconEvents' pointerdown): destroying the very element a drag
  // is about to manipulate makes the drag continue against a detached,
  // invisible clone until the next real render on release.
  function updateSelectionClasses(){
    document.querySelectorAll(".icon").forEach(el=>{
      const isSel = selected.has(el.dataset.id);
      el.classList.toggle("selected", isSel);
      const check = el.querySelector(".select-check");
      if(check) check.classList.toggle("checked", isSel);
    });
    if(multiSelectMode) updateStatusBar();
  }

  // Single source of truth for the status bar text: what it shows depends
  // on whether multi-select mode is active, not just which container is
  // being rendered. Called from render() (full rebuild) and from
  // updateSelectionClasses() (mid-gesture, no rebuild) so both paths agree.
  function updateStatusBar(){
    if(multiSelectMode){
      statusEl.textContent = `${selected.size} selected`;
    }else{
      const n = state.icons.filter(i=>i.parentId===null).length;
      statusEl.textContent = `${n} item${n===1?"":"s"} on desktop`;
    }
  }

  function toggleMultiSelect(){
    multiSelectMode = !multiSelectMode;
    if(!multiSelectMode) selected.clear();
    render();
  }

  /* ============ CLIPBOARD (copy / cut / paste) ============ */
  let clipboard = null; // { mode: "copy"|"cut", itemIds: [...] } | null

  function updateCutVisualState(){
    document.querySelectorAll(".icon").forEach(el=>{
      const isCut = !!(clipboard && clipboard.mode === "cut" && clipboard.itemIds.includes(el.dataset.id));
      el.classList.toggle("cut-pending", isCut);
    });
  }

  function copySelection(){
    if(selected.size === 0) return;
    clipboard = { mode:"copy", itemIds: Array.from(selected) };
    updateCutVisualState();
  }

  function cutSelection(){
    if(selected.size === 0) return;
    clipboard = { mode:"cut", itemIds: Array.from(selected) };
    updateCutVisualState();
  }

  // A folder can never be pasted into itself or into one of its own
  // descendants — that would create an unreachable/cyclic hierarchy.
  function wouldCreateCycle(item, targetParentId){
    if(item.type !== "folder" || targetParentId === null) return item.id === targetParentId;
    if(item.id === targetParentId) return true;
    let current = targetParentId;
    const visited = new Set();
    while(current !== null && current !== undefined){
      if(current === item.id) return true;
      if(visited.has(current)) break; // guards against already-corrupt data looping forever
      visited.add(current);
      const parentItem = state.icons.find(i=>i.id===current);
      if(!parentItem) break;
      current = parentItem.parentId;
    }
    return false;
  }

  // Recursively duplicates an item (and, for a folder, its entire
  // contents) with fresh ids. Children of a freshly-cloned folder use
  // simple row-major layout rather than nextFreeSlot: the new folder is
  // guaranteed empty, so there's nothing to avoid colliding with yet, and
  // checking occupancy against state.icons wouldn't see this clone's own
  // still-being-built siblings anyway (they aren't pushed to state.icons
  // until the whole recursive clone finishes).
  function deepCloneItem(item, targetParentId, position){
    const newItem = createItem(item.type, {
      label: item.label,
      color: item.color,
      url: item.url,
      appId: item.appId,
      manifestIcon: item.manifestIcon,
      themeColor: item.themeColor,
      tags: Array.isArray(item.tags) ? [...item.tags] : [],
      metadata: item.metadata ? {...item.metadata} : {},
      visible: item.visible,
      x: position.x, y: position.y,
      parentId: targetParentId
    });
    const clones = [newItem];
    if(item.type === "folder"){
      const children = childrenOf(item.id);
      const positions = layoutRowMajor(children.length, 5);
      children.forEach((child, i)=>{
        clones.push(...deepCloneItem(child, newItem.id, positions[i]));
      });
    }
    return clones;
  }

  function pasteClipboard(targetParentId){
    if(!clipboard || clipboard.itemIds.length === 0) return;
    const sourceItems = clipboard.itemIds.map(id=> state.icons.find(i=>i.id===id)).filter(Boolean);
    const validItems = sourceItems.filter(item=> !wouldCreateCycle(item, targetParentId));
    if(validItems.length === 0) return;

    const resultingIds = [];
    if(clipboard.mode === "copy"){
      validItems.forEach(item=>{
        const slot = nextFreeSlot(targetParentId);
        const clones = deepCloneItem(item, targetParentId, slot);
        state.icons.push(...clones);
        resultingIds.push(clones[0].id);
      });
    }else{
      validItems.forEach(item=>{
        const slot = nextFreeSlot(targetParentId);
        item.parentId = targetParentId;
        item.x = slot.x; item.y = slot.y;
        resultingIds.push(item.id);
      });
      clipboard = null; // cut is consumed after one paste, matching standard OS convention
    }
    selected = new Set(resultingIds);
    save();
    render();
    updateCutVisualState();
  }

  /* ============ MOVE TO FOLDER ============
     A direct, one-step alternative to Cut + navigate + Paste: pick any
     folder (or the desktop root) from a single list and relocate the
     current selection there immediately. */
  function listFoldersTree(parentId, depth, out){
    childrenOf(parentId).filter(i=>i.type==="folder").sort((a,b)=> a.label.localeCompare(b.label)).forEach(f=>{
      out.push({ folder:f, depth });
      listFoldersTree(f.id, depth+1, out);
    });
    return out;
  }

  function moveSelectionTo(targetParentId){
    const items = Array.from(selected).map(id=> state.icons.find(i=>i.id===id)).filter(Boolean);
    const validItems = items.filter(item=> !wouldCreateCycle(item, targetParentId));
    if(validItems.length === 0) return;
    const resultingIds = [];
    validItems.forEach(item=>{
      const slot = nextFreeSlot(targetParentId);
      item.parentId = targetParentId;
      item.x = slot.x; item.y = slot.y;
      resultingIds.push(item.id);
    });
    selected = new Set(resultingIds);
    save();
    render();
  }

  const movePickerOverlay = document.getElementById("movePickerOverlay");
  const movePickerList = document.getElementById("movePickerList");
  function openMovePicker(){
    const items = Array.from(selected).map(id=> state.icons.find(i=>i.id===id)).filter(Boolean);
    if(items.length === 0) return;

    document.getElementById("movePickerTitle").textContent = items.length > 1 ? `Move ${items.length} items` : `Move "${items[0].label}"`;

    const rows = [{ label:"Desktop", depth:0, id:null, icon:"desktop" }]
      .concat(listFoldersTree(null, 0, []).map(t=>({ label:t.folder.label, depth:t.depth+1, id:t.folder.id, icon:"folder" })))
      .filter(row => items.every(item => !wouldCreateCycle(item, row.id)));

    movePickerList.innerHTML = "";
    if(rows.length === 0){
      movePickerList.innerHTML = `<div class="move-empty">No other location to move this to.</div>`;
    }
    rows.forEach(row=>{
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "move-row";
      btn.style.paddingLeft = (10 + row.depth*18) + "px";
      btn.innerHTML = `<span class="ctx-icon">${menuIcon(row.icon)}</span><span>${escapeHtml(row.label)}</span>`;
      btn.addEventListener("click", ()=>{ moveSelectionTo(row.id); closeMovePicker(); });
      movePickerList.appendChild(btn);
    });

    movePickerOverlay.classList.add("open");
  }
  function closeMovePicker(){ movePickerOverlay.classList.remove("open"); }
  document.getElementById("movePickerCancel").addEventListener("click", closeMovePicker);
  movePickerOverlay.addEventListener("mousedown", (e)=>{ if(e.target===movePickerOverlay) closeMovePicker(); });

  /* ============ ICON EVENTS (drag, click, dblclick, rename) ============ */
  let dragState = null;

  // Is the dragged icon's current center point over another icon that's a
  // folder? Uses the SAME style.left/top coordinate space the drag already
  // tracks (both the dragged element's and candidates') rather than
  // getBoundingClientRect/offsetWidth, which depend on real browser layout.
  function findFolderDropTarget(draggedEl, draggedItemId, container){
    const cell = getCellSize();
    const dl = parseFloat(draggedEl.style.left), dt = parseFloat(draggedEl.style.top);
    const dcx = dl + cell.w/2, dcy = dt + cell.h/2;
    let best = null;
    container.querySelectorAll(".icon").forEach(candEl=>{
      if(candEl === draggedEl) return;
      const id = candEl.dataset.id;
      if(id === draggedItemId) return;
      const candItem = state.icons.find(i=>i.id===id);
      if(!candItem || candItem.type !== "folder") return;
      const l = parseFloat(candEl.style.left), t = parseFloat(candEl.style.top);
      if(dcx >= l && dcx <= l+cell.w && dcy >= t && dcy <= t+cell.h){
        best = candEl;
      }
    });
    return best;
  }

  function wireIconEvents(el, item, parentId){
    let downX, downY, moved=false, startLeft, startTop;

    el.addEventListener("focus", ()=>{ focusedIconId = item.id; });

    el.addEventListener("pointerdown", (e)=>{
      if(e.pointerType === "mouse" && e.button !== 0) return;
      if(e.target.isContentEditable) return;
      e.stopPropagation();
      const pointerType = e.pointerType || "mouse";
      const pointerId = e.pointerId;
      downX = e.clientX; downY = e.clientY; moved = false;
      startLeft = parseFloat(el.style.left);
      startTop = parseFloat(el.style.top);
      try{ el.setPointerCapture(pointerId); }catch(err){}
      el.focus({ preventScroll: true });

      if(multiSelectMode){
        if(selected.has(item.id)) selected.delete(item.id); else selected.add(item.id);
        updateSelectionClasses();
      } else if(!e.shiftKey && !selected.has(item.id)){
        selected = new Set([item.id]);
        updateSelectionClasses();
      } else if(e.shiftKey){
        if(selected.has(item.id)) selected.delete(item.id); else selected.add(item.id);
        updateSelectionClasses();
      }

      dragState = { item, el, parentId, offsetX: downX-startLeft, offsetY: downY-startTop };

      function onMove(ev){
        if(ev.pointerId !== pointerId) return;
        const dx = ev.clientX - downX, dy = ev.clientY - downY;
        if(Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        if(!moved) return;
        ev.preventDefault();
        el.classList.add("dragging");
        el.style.left = (startLeft + dx) + "px";
        el.style.top = (startTop + dy) + "px";

        const container = parentId===null ? gridLayer : folderBody;
        const target = findFolderDropTarget(el, item.id, container);
        container.querySelectorAll(".icon.drop-target").forEach(o=>{ if(o!==target) o.classList.remove("drop-target"); });
        if(target) target.classList.add("drop-target");
      }
      function onUp(ev){
        if(ev.pointerId !== pointerId) return;
        try{ el.releasePointerCapture(pointerId); }catch(err){}
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        el.classList.remove("dragging");
        const container = parentId===null ? gridLayer : folderBody;
        const dropTargetEl = container.querySelector(".icon.drop-target");
        if(dropTargetEl) dropTargetEl.classList.remove("drop-target");

        if(moved){
          const dropFolderId = dropTargetEl ? dropTargetEl.dataset.id : null;
          if(dropFolderId && !wouldCreateCycle(item, dropFolderId)){
            // Move into the folder. If the dragged icon was part of a
            // multi-selection, bring the whole selection along with it.
            const idsToMove = selected.has(item.id) && selected.size > 1 ? Array.from(selected) : [item.id];
            idsToMove.forEach(id=>{
              const it = state.icons.find(i=>i.id===id);
              if(!it || it.id === dropFolderId || wouldCreateCycle(it, dropFolderId)) return;
              const slot = nextFreeSlot(dropFolderId);
              it.parentId = dropFolderId;
              it.x = slot.x; it.y = slot.y;
            });
          }else{
            const left = parseFloat(el.style.left), top = parseFloat(el.style.top);
            const cell = getCellSize();
            const offset = getGridOffset(parentId);
            const gx = Math.round((left - offset.left) / cell.w);
            const gy = Math.round((top - offset.top) / cell.h);
            const slot = nearestFreeSlot(parentId, Math.max(0,gx), Math.max(0,gy), item.id);
            item.x = slot.x; item.y = slot.y;
          }
          save();
          render();
        } else if((pointerType === "touch" || pointerType === "pen") && !multiSelectMode){
          // Touch/stylus: a tap that didn't drag opens the item directly.
          openItem(item);
        }
        setTimeout(()=>{ moved = false; }, 0);
      }
      document.addEventListener("pointermove", onMove, {passive:false});
      document.addEventListener("pointerup", onUp);
    });

    // Desktop/mouse: double-click opens. Touch opens on single tap (handled above).
    el.addEventListener("dblclick", (e)=>{
      if(e.target.classList.contains("icon-label")) return;
      openItem(item);
    });

    const label = el.querySelector(".icon-label");
    label.addEventListener("dblclick", (e)=>{
      e.stopPropagation();
      startRename(label, item);
    });

    el.addEventListener("contextmenu", (e)=>{
      e.preventDefault(); e.stopPropagation();
      if(!selected.has(item.id)) selectOnly(item.id);
      showIconContextMenu(e.clientX, e.clientY, item, parentId);
    });
  }

  function startRename(label, item){
    label.contentEditable = "true";
    label.classList.add("editing");
    const range = document.createRange();
    range.selectNodeContents(label);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    label.focus();

    function commit(){
      label.contentEditable = "false";
      const text = label.textContent.trim() || "Untitled";
      item.label = text;
      save();
      render();
    }
    label.addEventListener("blur", commit, {once:true});
    label.addEventListener("keydown", function ke(e){
      e.stopPropagation(); // this input owns its own keystrokes; nothing above (grid arrow-key nav, open-on-Enter/Space) should see them while editing
      if(e.key === "Enter"){ e.preventDefault(); label.blur(); }
      if(e.key === "Escape"){ label.textContent = item.label; label.blur(); }
    });
  }

  const folderBackBtn = document.getElementById("folderBack");
  function updateFolderBackButton(){
    folderBackBtn.style.display = folderStack.length > 0 ? "" : "none";
  }

  function openItem(item){
    if(item.type === "folder"){
      if(currentFolderId !== null) folderStack.push(currentFolderId); // drilling deeper from an already-open folder
      currentFolderId = item.id;
      folderTitle.innerHTML = `${folderSVG(item.color)} ${escapeHtml(item.label)}`;
      folderOverlay.classList.add("open");
      updateFolderBackButton();
      render();
    }else if(item.type === "app"){
      AppManager.launch(item.appId, { title: item.label, color: item.color });
    }else{
      window.open(item.url, "_blank", "noopener");
    }
  }

  folderBackBtn.addEventListener("click", ()=>{
    if(folderStack.length === 0) return;
    currentFolderId = folderStack.pop();
    const item = state.icons.find(i=>i.id===currentFolderId);
    if(item) folderTitle.innerHTML = `${folderSVG(item.color)} ${escapeHtml(item.label)}`;
    updateFolderBackButton();
    render();
  });

  document.getElementById("folderClose").addEventListener("click", ()=>{
    folderOverlay.classList.remove("open");
    currentFolderId = null;
    folderStack = [];
  });
  folderOverlay.addEventListener("mousedown", (e)=>{
    if(e.target === folderOverlay){ folderOverlay.classList.remove("open"); currentFolderId = null; folderStack = []; }
  });

  /* ============ DELETE ============ */
  // Expands a set of directly-selected ids to include every descendant of
  // any selected folder, so the confirmation prompt and the eventual
  // delete both operate on the true, full set — not just what was clicked.
  function computeDeleteSet(ids){
    const toDelete = new Set(ids);
    let changed = true;
    while(changed){
      changed = false;
      state.icons.forEach(i=>{
        if(toDelete.has(i.parentId) && !toDelete.has(i.id)){ toDelete.add(i.id); changed = true; }
      });
    }
    return toDelete;
  }

  function performDelete(ids){
    const toDelete = computeDeleteSet(ids);
    state.icons = state.icons.filter(i => !toDelete.has(i.id));
    selected.clear();
    save();
    render();
  }

  let pendingDeleteIds = null;
  const deleteConfirmOverlay = document.getElementById("deleteConfirmOverlay");
  const deleteConfirmTitle = document.getElementById("deleteConfirmTitle");
  const deleteConfirmBody = document.getElementById("deleteConfirmBody");

  function requestDeleteConfirm(ids){
    const items = ids.map(id=> state.icons.find(i=>i.id===id)).filter(Boolean);
    if(items.length === 0) return;
    const toDelete = computeDeleteSet(ids);
    pendingDeleteIds = ids;

    if(items.length === 1){
      const item = items[0];
      const extra = toDelete.size - 1;
      deleteConfirmTitle.textContent = `Delete "${item.label}"?`;
      deleteConfirmBody.textContent = (item.type === "folder" && extra > 0)
        ? `This will also delete everything inside it — ${extra} item${extra===1?"":"s"}. This can't be undone.`
        : `This can't be undone.`;
    }else{
      const extra = toDelete.size - items.length;
      deleteConfirmTitle.textContent = `Delete ${items.length} items?`;
      deleteConfirmBody.textContent = (extra > 0)
        ? `${toDelete.size} items will be deleted in total, including the contents of any selected folders. This can't be undone.`
        : `This can't be undone.`;
    }
    deleteConfirmOverlay.classList.add("open");
  }

  function closeDeleteConfirm(){
    deleteConfirmOverlay.classList.remove("open");
    pendingDeleteIds = null;
  }

  document.getElementById("deleteConfirmCancel").addEventListener("click", closeDeleteConfirm);
  document.getElementById("deleteConfirmConfirm").addEventListener("click", ()=>{
    const ids = pendingDeleteIds;
    closeDeleteConfirm();
    if(ids) performDelete(ids);
  });
  deleteConfirmOverlay.addEventListener("mousedown", (e)=>{ if(e.target===deleteConfirmOverlay) closeDeleteConfirm(); });

  function deleteSelected(){
    if(selected.size === 0) return;
    requestDeleteConfirm(Array.from(selected));
  }

  document.addEventListener("keydown", (e)=>{
    const ae = document.activeElement;
    const typing = ae && (ae.isContentEditable || ae.tagName === "INPUT" || ae.tagName === "TEXTAREA");
    if(typing) return;
    if((e.key === "Delete" || e.key === "Backspace") && selected.size > 0){
      e.preventDefault();
      deleteSelected();
    }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "c" && selected.size > 0){
      e.preventDefault();
      copySelection();
    }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "x" && selected.size > 0){
      e.preventDefault();
      cutSelection();
    }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "v" && clipboard){
      e.preventDefault();
      pasteClipboard(currentFolderId);
    }
    if(e.key === "Escape"){
      closeCtxMenu();
      if(itemOverlay.classList.contains("open")) closeItemModal();
      if(appPickerOverlay.classList.contains("open")) closeAppPicker();
      if(deleteConfirmOverlay.classList.contains("open")) closeDeleteConfirm();
      if(movePickerOverlay.classList.contains("open")) closeMovePicker();
      document.getElementById("settingsPop").classList.remove("open");
      if(folderOverlay.classList.contains("open")){ folderOverlay.classList.remove("open"); currentFolderId=null; folderStack=[]; }
      multiSelectMode = false;
      clearSelection();
    }
  });

  // Generic keyboard-activation bridge: any role="button" element (settings
  // gear, search-go, FAB, folder close, etc.) responds to Enter/Space the
  // same way a native button element would. Icons and context-menu items manage
  // their own Enter/Space handling already, so they're excluded here to
  // avoid double-firing.
  document.addEventListener("keydown", (e)=>{
    if(e.key !== "Enter" && e.key !== " ") return;
    const t = e.target;
    if(!t || t.getAttribute("role") !== "button") return;
    if(t.classList.contains("icon") || t.classList.contains("ctx-item")) return;
    e.preventDefault();
    t.click();
  });

  /* ============ RUBBER BAND SELECT (desktop root, mouse only) ============ */
  let rbStart = null;
  desktop.addEventListener("pointerdown", (e)=>{
    if(e.pointerType !== "mouse") return; // touch scrolls/taps naturally instead
    if(e.button !== 0) return;
    if(e.target.closest(".icon")) return;
    closeCtxMenu();
    document.getElementById("settingsPop").classList.remove("open");
    const pointerId = e.pointerId;
    const rect = desktop.getBoundingClientRect();
    rbStart = { x: e.clientX - rect.left + desktop.scrollLeft, y: e.clientY - rect.top + desktop.scrollTop };
    rubberband.style.display = "block";
    rubberband.style.left = rbStart.x + "px";
    rubberband.style.top = rbStart.y + "px";
    rubberband.style.width = "0px";
    rubberband.style.height = "0px";
    if(!e.shiftKey) selected.clear();

    function onMove(ev){
      if(ev.pointerId !== pointerId) return;
      const r = desktop.getBoundingClientRect();
      const cx = ev.clientX - r.left + desktop.scrollLeft;
      const cy = ev.clientY - r.top + desktop.scrollTop;
      const x = Math.min(cx, rbStart.x), y = Math.min(cy, rbStart.y);
      const w = Math.abs(cx - rbStart.x), h = Math.abs(cy - rbStart.y);
      rubberband.style.left = x+"px"; rubberband.style.top = y+"px";
      rubberband.style.width = w+"px"; rubberband.style.height = h+"px";

      // hit test using each icon's real rendered size
      const bandRect = { left:x, top:y, right:x+w, bottom:y+h };
      gridLayer.querySelectorAll(".icon").forEach(el=>{
        const l = parseFloat(el.style.left), t = parseFloat(el.style.top);
        const r2 = { left:l, top:t, right:l+el.offsetWidth, bottom:t+el.offsetHeight };
        const hit = !(r2.right < bandRect.left || r2.left > bandRect.right || r2.bottom < bandRect.top || r2.top > bandRect.bottom);
        const id = el.dataset.id;
        if(hit) selected.add(id);
        el.classList.toggle("selected", selected.has(id));
      });
    }
    function onUp(ev){
      if(ev.pointerId !== pointerId) return;
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      rubberband.style.display = "none";
      rbStart = null;
    }
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
  });

  desktop.addEventListener("click", (e)=>{
    if(!e.target.closest(".icon") && !rbStart){ clearSelection(); focusedWindowId = null; }
  });

  folderBody.addEventListener("pointerdown", (e)=>{
    if(e.target.closest(".icon")) return;
    if(!e.shiftKey){ selected.clear(); render(); }
  });

  /* ============ CONTEXT MENUS ============ */
  let activeSubmenu = null;
  let activeSubmenuTrigger = null;

  function closeSubmenu(){
    if(activeSubmenu){ activeSubmenu.remove(); activeSubmenu = null; }
    if(activeSubmenuTrigger){ activeSubmenuTrigger.setAttribute("aria-expanded", "false"); activeSubmenuTrigger = null; }
  }
  function closeCtxMenu(){
    closeSubmenu();
    if(activeCtxMenu){ activeCtxMenu.remove(); activeCtxMenu = null; }
  }
  document.addEventListener("click", (e)=>{
    const inMenu = activeCtxMenu && activeCtxMenu.contains(e.target);
    const inSubmenu = activeSubmenu && activeSubmenu.contains(e.target);
    if(activeCtxMenu && !inMenu && !inSubmenu) closeCtxMenu();
  });

  // Builds one menu level (either the top-level menu or a submenu flyout)
  // as a detached element — positioning and insertion happen in the two
  // call sites below, since a submenu is measured before it's placed.
  function buildMenuEl(items){
    const menu = document.createElement("div");
    menu.className = "ctx-menu";
    menu.setAttribute("role", "menu");
    items.forEach(it=>{
      if(it === "sep"){
        const s = document.createElement("div");
        s.className = "ctx-sep";
        s.setAttribute("role", "separator");
        menu.appendChild(s);
        return;
      }
      const row = document.createElement("div");
      row.className = "ctx-item" + (it.danger ? " danger" : "");
      row.setAttribute("role", "menuitem");
      row.tabIndex = -1;
      const iconHTML = it.icon ? `<span class="ctx-icon">${menuIcon(it.icon)}</span>` : "";
      const trailing = it.submenu
        ? `<span class="ctx-chevron">${menuIcon("chevron")}</span>`
        : (it.hint ? `<span class="ctx-hint">${it.hint}</span>` : "");
      row.innerHTML = `<span class="ctx-main">${iconHTML}<span>${it.label}</span></span>${trailing}`;
      if(it.submenu){
        row.setAttribute("aria-haspopup", "true");
        row.setAttribute("aria-expanded", "false");
        row.addEventListener("click", (e)=>{ e.stopPropagation(); openSubmenu(row, it.submenu); });
      }else{
        row.addEventListener("click", ()=>{ closeCtxMenu(); it.action(); });
      }
      menu.appendChild(row);
    });
    // Scoped to this level's own rows (direct children) so an open submenu's
    // keyboard nav doesn't also get intercepted by the parent menu's
    // identical listener further up the (bubbling) DOM chain.
    menu.addEventListener("keydown", (e)=>{
      const rows = Array.from(menu.children).filter(el => el.getAttribute && el.getAttribute("role") === "menuitem");
      const i = rows.indexOf(document.activeElement);
      if(e.key === "ArrowDown"){ e.preventDefault(); e.stopPropagation(); (rows[i+1] || rows[0]).focus(); }
      else if(e.key === "ArrowUp"){ e.preventDefault(); e.stopPropagation(); (rows[i-1] || rows[rows.length-1]).focus(); }
      else if(e.key === "Home"){ e.preventDefault(); e.stopPropagation(); rows[0].focus(); }
      else if(e.key === "End"){ e.preventDefault(); e.stopPropagation(); rows[rows.length-1].focus(); }
      else if(e.key === "Enter" || e.key === " "){ e.preventDefault(); e.stopPropagation(); document.activeElement.click(); }
    });
    return menu;
  }

  // Submenus are appended to <body> (a sibling of the main menu, not a
  // descendant) rather than nested inside the trigger row — buildMenu's
  // .ctx-menu uses backdrop-filter, which in some browsers establishes a
  // containing block for fixed-position descendants and would throw off
  // viewport-relative left/top math. Keeping it a body-level sibling avoids
  // that entirely; closeCtxMenu()/the outside-click handler above track it
  // explicitly instead of relying on DOM nesting for cleanup.
  function openSubmenu(triggerRow, items){
    if(activeSubmenuTrigger === triggerRow){ closeSubmenu(); return; }
    closeSubmenu();
    const sub = buildMenuEl(items);
    sub.style.visibility = "hidden";
    document.body.appendChild(sub);
    const r = triggerRow.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    const sw = sub.offsetWidth, sh = sub.offsetHeight;
    const left = (r.right + sw <= vw - 8) ? r.right - 2 : Math.max(8, r.left - sw + 2);
    const top = Math.min(Math.max(8, r.top - 6), vh - sh - 8);
    sub.style.left = left + "px";
    sub.style.top = top + "px";
    sub.style.visibility = "";
    activeSubmenu = sub;
    activeSubmenuTrigger = triggerRow;
    triggerRow.setAttribute("aria-expanded", "true");
    const firstRow = sub.querySelector('[role="menuitem"]');
    if(firstRow) firstRow.focus();
  }

  function buildMenu(items, x, y){
    closeCtxMenu();
    const menu = buildMenuEl(items);
    document.body.appendChild(menu);
    const vw = window.innerWidth, vh = window.innerHeight;
    const mw = 200, mh = items.length * 34 + 20;
    menu.style.left = Math.min(x, vw-mw-8) + "px";
    menu.style.top = Math.min(y, vh-mh-8) + "px";
    activeCtxMenu = menu;
    const firstRow = menu.querySelector('[role="menuitem"]');
    if(firstRow) firstRow.focus();
  }

  gridLayer.addEventListener("contextmenu", (e)=>{
    if(e.target.closest(".icon")) return;
    e.preventDefault();
    showCanvasContextMenu(e.clientX, e.clientY, null);
  });
  folderBody.addEventListener("contextmenu", (e)=>{

  const SORT_TYPE_ORDER = { folder:0, app:1, bookmark:2, webapp:3 };

  /* ============ WINDOW MANAGER ============ */
  let windows = [];        // { id, appId, title, color, x,y,w,h, z, minimized, maximized, prevBounds }
  let topZ = 100;
  let focusedWindowId = null;
  const windowKeyHandlers = {}; // winId -> function(e)

  function maxBounds(){
    const cs = getComputedStyle(document.documentElement);
    const topbarH = parseFloat(cs.getPropertyValue("--topbar-h")) || 44;
    const searchH = parseFloat(cs.getPropertyValue("--searchbar-h")) || 58;
    const safeTop = parseFloat(cs.getPropertyValue("--safe-top")) || 0;
    const safeLeft = parseFloat(cs.getPropertyValue("--safe-left")) || 0;
    const safeRight = parseFloat(cs.getPropertyValue("--safe-right")) || 0;
    const safeBottom = parseFloat(cs.getPropertyValue("--safe-bottom")) || 0;
    const top = topbarH + safeTop + searchH + 10;
    const taskbarH = document.body.classList.contains("has-taskbar") ? 62 + safeBottom : 0;
    return {
      x: 8 + safeLeft,
      y: top,
      w: window.innerWidth - 16 - safeLeft - safeRight,
      h: window.innerHeight - top - taskbarH - 8 - safeBottom
    };
  }

  function openWindow(appId, title, color){
    const app = AppManager.getMetadata(appId);
    if(!app) return;
    let win = windows.find(w=>w.id===appId);
    if(win){
      win.minimized = false;
      focusWindow(win.id);
      renderWindows();
      return;
    }
    const vw = window.innerWidth, vh = window.innerHeight;
    const w = Math.min(app.defaultWidth, vw-32);
    const h = Math.min(app.defaultHeight, vh-160);
    const stack = windows.length % 6;
    win = {
      id: appId, appId, title, color,
      x: Math.round((vw-w)/2 + stack*20),
      y: Math.round((vh-h)/2 - 30 + stack*18),
      w, h,
      z: ++topZ,
      minimized: false,
      maximized: false,
      prevBounds: null
    };
    windows.push(win);
    focusedWindowId = win.id;
    renderWindows();
  }

  function focusWindow(id){
    const win = windows.find(w=>w.id===id);
    if(!win) return;
    win.z = ++topZ;
    focusedWindowId = id;
    renderWindows();
  }

  function closeWindow(id){
    windows = windows.filter(w=>w.id!==id);
    delete windowKeyHandlers[id];
    const el = document.getElementById("win-"+id);
    if(el) el.remove();
    if(focusedWindowId === id){
      const top = windows.slice().sort((a,b)=>b.z-a.z)[0];
      focusedWindowId = top ? top.id : null;
    }
    updateTaskbar();
    AppManager.notifyClosed(id);
  }

  function minimizeWindow(id){
    const win = windows.find(w=>w.id===id);
    if(!win) return;
    win.minimized = true;
    if(focusedWindowId === id){
      const top = windows.filter(w=>!w.minimized && w.id!==id).sort((a,b)=>b.z-a.z)[0];
      focusedWindowId = top ? top.id : null;
    }
    renderWindows();
  }

  function toggleMaximize(id){
    const win = windows.find(w=>w.id===id);
    if(!win) return;
    if(win.maximized){
      Object.assign(win, win.prevBounds);
      win.maximized = false;
    }else{
      win.prevBounds = { x: win.x, y: win.y, w: win.w, h: win.h };
      const b = maxBounds();
      win.x = b.x; win.y = b.y; win.w = b.w; win.h = b.h;
      win.maximized = true;
    }
    focusWindow(id);
  }

  function buildWindowEl(win){
    const app = AppManager.getMetadata(win.appId);
    const el = document.createElement("div");
    el.className = "oswindow";
    el.id = "win-"+win.id;
    el.innerHTML = `
      <div class="oswindow-titlebar">
        <div class="oswindow-title">
          <span class="oswindow-icon" style="color:${win.color}">${app.icon(win.color)}</span>
          <span>${escapeHtml(win.title)}</span>
        </div>
        <div class="oswindow-controls">
          <div class="win-btn win-min" title="Minimize">&#8211;</div>
          <div class="win-btn win-max" title="Maximize">&#9633;</div>
          <div class="win-btn win-close" title="Close">&#10005;</div>
        </div>
      </div>
      <div class="oswindow-body"></div>
      <div class="oswindow-resize"></div>
    `;
    el.addEventListener("pointerdown", ()=>{ if(focusedWindowId!==win.id) focusWindow(win.id); });

    const titlebar = el.querySelector(".oswindow-titlebar");
    wireWindowDrag(titlebar, win, el);
    titlebar.addEventListener("dblclick", (e)=>{ if(!e.target.closest(".win-btn")) toggleMaximize(win.id); });

    const resizeHandle = el.querySelector(".oswindow-resize");
    if(app.resizable === false){
      resizeHandle.style.display = "none";
    }else{
      wireWindowResize(resizeHandle, win, el);
    }

    el.querySelector(".win-min").addEventListener("click", (e)=>{ e.stopPropagation(); minimizeWindow(win.id); });
    el.querySelector(".win-max").addEventListener("click", (e)=>{ e.stopPropagation(); toggleMaximize(win.id); });
    el.querySelector(".win-close").addEventListener("click", (e)=>{ e.stopPropagation(); closeWindow(win.id); });

    // Containment boundary: a thrown exception during an app's render
    // shouldn't take down the desktop or any other window. This is NOT true
    // process isolation (an infinite loop would still hang the tab) — real
    // isolation needs iframes or workers, a bigger commitment not yet
    // justified for two first-party apps. This catches the common case —
    // both a synchronous throw AND a rejection from an async render
    // function (a plain try/catch alone only covers the synchronous part
    // of an async function, not what happens after its first await).
    try{
      const api = AppManager.buildAPI(win.appId, win.id);
      const result = app.render(el.querySelector(".oswindow-body"), api);
      if(result && typeof result.catch === "function"){
        result.catch(err=>{
          console.error(`on369: app "${win.appId}" threw during async render`, err);
        });
      }
    }catch(err){
      console.error(`on369: app "${win.appId}" threw during render`, err);
      el.querySelector(".oswindow-body").innerHTML =
        `<div style="padding:20px;font-size:13px;color:var(--text-secondary);">This app hit an error and couldn't load.</div>`;
    }
    return el;
  }

  function wireWindowDrag(handle, win, el){
    handle.addEventListener("pointerdown", (e)=>{
      if(e.target.closest(".win-btn")) return;
      if(e.pointerType==="mouse" && e.button!==0) return;
      focusWindow(win.id);
      const startX = e.clientX, startY = e.clientY;
      const originX = win.x, originY = win.y;
      const pointerId = e.pointerId;
      try{ handle.setPointerCapture(pointerId); }catch(err){}
      function onMove(ev){
        if(ev.pointerId!==pointerId) return;
        win.x = originX + (ev.clientX-startX);
        win.y = Math.max(4, originY + (ev.clientY-startY));
        el.style.left = win.x+"px"; el.style.top = win.y+"px";
      }
      function onUp(ev){
        if(ev.pointerId!==pointerId) return;
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        try{ handle.releasePointerCapture(pointerId); }catch(err){}
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
    });
  }

  function wireWindowResize(handle, win, el){
    handle.addEventListener("pointerdown", (e)=>{
      e.stopPropagation();
      focusWindow(win.id);
      const app = AppManager.getMetadata(win.appId);
      const startX = e.clientX, startY = e.clientY;
      const originW = win.w, originH = win.h;
      const pointerId = e.pointerId;
      try{ handle.setPointerCapture(pointerId); }catch(err){}
      function onMove(ev){
        if(ev.pointerId!==pointerId) return;
        let w = Math.max(app.minWidth, originW + (ev.clientX-startX));
        let h = Math.max(app.minHeight, originH + (ev.clientY-startY));
        if(app.maxWidth) w = Math.min(w, app.maxWidth);
        if(app.maxHeight) h = Math.min(h, app.maxHeight);
        win.w = w; win.h = h;
        el.style.width = win.w+"px"; el.style.height = win.h+"px";
      }
      function onUp(ev){
        if(ev.pointerId!==pointerId) return;
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        try{ handle.releasePointerCapture(pointerId); }catch(err){}
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
    });
  }

  function renderWindows(){
    windows.forEach(win=>{
      let el = document.getElementById("win-"+win.id);
      if(!el){
        el = buildWindowEl(win);
        windowLayer.appendChild(el);
      }
      el.style.display = win.minimized ? "none" : "flex";
      el.style.left = win.x+"px";
      el.style.top = win.y+"px";
      el.style.width = win.w+"px";
      el.style.height = win.h+"px";
      el.style.zIndex = win.z;
    });
    updateTaskbar();
  }

  function updateTaskbar(){
    taskbar.innerHTML = "";
    if(windows.length === 0){
      document.body.classList.remove("has-taskbar");
      return;
    }
    document.body.classList.add("has-taskbar");
    const maxZ = Math.max.apply(null, windows.map(w=>w.z));
    windows.slice().sort((a,b)=>a.z-b.z).forEach(win=>{
      const app = AppManager.getMetadata(win.appId);
      const pill = document.createElement("div");
      pill.className = "taskbar-pill" + (!win.minimized ? " active" : "");
      pill.innerHTML = `<span class="tb-icon" style="color:${win.color}">${app.icon(win.color)}</span><span class="tb-label">${escapeHtml(win.title)}</span><span class="tb-close" title="Close">&#10005;</span>`;
      pill.addEventListener("click", (e)=>{
        if(e.target.classList.contains("tb-close")){ closeWindow(win.id); return; }
        if(win.minimized){ win.minimized = false; focusWindow(win.id); }
        else if(win.z === maxZ){ minimizeWindow(win.id); }
        else{ focusWindow(win.id); }
      });
      taskbar.appendChild(pill);
    });
  }

  // Route keyboard input to whichever window is currently focused, but never
  // hijack typing into a text field (search box, rename label, modal inputs).
  document.addEventListener("keydown", (e)=>{
    if(!focusedWindowId) return;

    const handler = windowKeyHandlers[focusedWindowId];
    if(handler) handler(e);
  });

  /* ============ BOOKMARK IMPORT ============
     Reads a standard Netscape Bookmark File (the HTML every major browser
     produces via "Export bookmarks") and rebuilds the same folder structure
     as real FolderItem/BookmarkItem records. There's no browser API for a
     page to read bookmarks directly — export-then-upload is the only path
     available to a regular web page, and it's what every bookmark-import
     tool actually does under the hood. */

  // Walks a <dl> exactly as browsers actually nest it (confirmed empirically,
  // not assumed): each <dt> either directly contains an <a> (a bookmark) or
  // an <h3> plus a following <dl> sibling, BOTH as direct children of that
  // same <dt> (a folder). Stray empty <p> siblings are simply skipped.
  function parseBookmarksDL(dlEl){
    const items = [];
    Array.from(dlEl.children).forEach(dt=>{
      if(dt.tagName !== "DT") return;
      const a = dt.querySelector(":scope > a");
      if(a){
        const href = a.getAttribute("href") || "";
        if(!href) return;
        items.push({ kind:"bookmark", label: (a.textContent||"").trim() || href, url: href });
        return;
      }
      const h3 = dt.querySelector(":scope > h3");
      if(h3){
        const nestedDL = dt.querySelector(":scope > dl");
        items.push({
          kind:"folder",
          label: (h3.textContent||"").trim() || "Folder",
          children: nestedDL ? parseBookmarksDL(nestedDL) : []
        });
      }
    });
    return items;
  }

  function parseBookmarksHTML(text){
    const doc = new DOMParser().parseFromString(text, "text/html");
    const rootDL = doc.querySelector("dl");
    if(!rootDL) return [];
    return parseBookmarksDL(rootDL);
  }

  function countBookmarkTree(tree){
    let bookmarks = 0, folders = 0;
    tree.forEach(node=>{
      if(node.kind === "bookmark") bookmarks++;
      else{
        folders++;
        const sub = countBookmarkTree(node.children);
        bookmarks += sub.bookmarks;
        folders += sub.folders;
      }
    });
    return { bookmarks, folders };
  }

  // Lays out a freshly-created set of siblings in simple row-major order.
  // Safe because these are all brand-new items with no existing occupants
  // to collide with — nextFreeSlot's incremental scan isn't needed here and
  // would be far slower across a large import.
  function layoutRowMajor(count, cols){
    const positions = [];
    for(let i=0;i<count;i++) positions.push({ x: i % cols, y: Math.floor(i/cols) });
    return positions;
  }

  // Converts the parsed tree into real Item instances, appending them to
  // newItems (batched — one Store write at the end, not one per item).
  function materializeBookmarkTree(tree, parentId, newItems){
    const positions = layoutRowMajor(tree.length, 5);
    tree.forEach((node, i)=>{
      const pos = positions[i];
      if(node.kind === "bookmark"){
        newItems.push(createItem("bookmark", {
          label: node.label, url: node.url,
          color: COLORS[newItems.length % COLORS.length],
          x: pos.x, y: pos.y, parentId
        }));
      }else{
        const folder = createItem("folder", {
          label: node.label,
          color: COLORS[newItems.length % COLORS.length],
          x: pos.x, y: pos.y, parentId
        });
        newItems.push(folder);
        materializeBookmarkTree(node.children, folder.id, newItems);
      }
    });
  }

  let pendingImportTree = null;
  let pendingImportParentId = null;
  const bookmarkImportInput = document.getElementById("bookmarkImportInput");
  const importOverlay = document.getElementById("importOverlay");
  const importSummary = document.getElementById("importSummary");
  const importFolderName = document.getElementById("importFolderName");

  function triggerBookmarkImport(parentId){
    pendingImportParentId = parentId;
    bookmarkImportInput.value = "";
    bookmarkImportInput.click();
  }

  bookmarkImportInput.addEventListener("change", ()=>{
    const file = bookmarkImportInput.files && bookmarkImportInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      let tree;
      try{
        tree = parseBookmarksHTML(String(reader.result || ""));
      }catch(e){
        console.warn("on369: bookmark import parse failed", e);
        tree = [];
      }
      const { bookmarks, folders } = countBookmarkTree(tree);
      if(bookmarks === 0 && folders === 0){
        importSummary.innerHTML = `Couldn't find any bookmarks in that file. Make sure it's an exported bookmarks HTML file (browsers export this from their bookmark manager's "Export bookmarks" option).`;
        document.getElementById("importConfirm").style.display = "none";
      }else{
        importSummary.innerHTML = `Found <b>${bookmarks}</b> bookmark${bookmarks===1?"":"s"} in <b>${folders}</b> folder${folders===1?"":"s"}.`;
        document.getElementById("importConfirm").style.display = "";
      }
      pendingImportTree = tree;
      importFolderName.value = `Imported ${new Date().toLocaleDateString()}`;
      importOverlay.classList.add("open");
      setTimeout(()=> importFolderName.focus(), 30);
    };
    reader.onerror = ()=>{
      console.warn("on369: bookmark import file read failed", reader.error);
    };
    reader.readAsText(file);
  });

  function closeImportModal(){ importOverlay.classList.remove("open"); pendingImportTree = null; }
  document.getElementById("importCancel").addEventListener("click", closeImportModal);
  importOverlay.addEventListener("mousedown", (e)=>{ if(e.target===importOverlay) closeImportModal(); });

  document.getElementById("importConfirm").addEventListener("click", async ()=>{
    if(!pendingImportTree || pendingImportTree.length===0) return;
    const folderName = importFolderName.value.trim() || "Imported Bookmarks";
    const slot = nextFreeSlot(pendingImportParentId);
    const rootFolder = createItem("folder", {
      label: folderName, color: COLORS[3], x: slot.x, y: slot.y, parentId: pendingImportParentId
    });
    const newItems = [rootFolder];
    materializeBookmarkTree(pendingImportTree, rootFolder.id, newItems);

    state.icons.push(...newItems);
    closeImportModal();
    render();
    await save();
  });

  /* ============ BOOKMARK EXPORT ============
     The reverse of the importer above: walks the desktop tree and writes
     it back out as a standard Netscape bookmark file — the same format
     browsers themselves export, so the result can be re-imported into
     on369, Chrome, Firefox, Safari, etc. Only bookmarks, web apps, and
     folders are included; native apps (Calculator, Todo, ...) have no
     URL and aren't part of a bookmarks export, same as a browser would
     never export its installed extensions alongside its bookmarks. */
  function escapeHtmlAttr(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function serializeBookmarkTree(parentId, depth){
    const pad = "    ".repeat(depth);
    const items = childrenOf(parentId)
      .filter(i => i.type === "bookmark" || i.type === "webapp" || i.type === "folder")
      .sort((a,b)=> a.y - b.y || a.x - b.x);
    let html = `${pad}<DL><p>\n`;
    items.forEach(item=>{
      if(item.type === "folder"){
        html += `${pad}    <DT><H3>${escapeHtmlAttr(item.label)}</H3>\n`;
        html += serializeBookmarkTree(item.id, depth+1);
      }else{
        html += `${pad}    <DT><A HREF="${escapeHtmlAttr(item.url)}">${escapeHtmlAttr(item.label)}</A>\n`;
      }
    });
    html += `${pad}</DL><p>\n`;
    return html;
  }

  function exportBookmarks(){
    const doc = `<!DOCTYPE NETSCAPE-Bookmark-file-1>
<!-- This is an automatically generated file.
     It will be read and overwritten.
     DO NOT EDIT! -->
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">
<TITLE>Bookmarks</TITLE>
<H1>Bookmarks</H1>
${serializeBookmarkTree(null, 0)}`;
    const blob = new Blob([doc], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `on369-bookmarks-${new Date().toISOString().slice(0,10)}.html`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
  }

  /* ============ APP: CALCULATOR ============ */
  function renderCalculatorApp(body, api){
    body.innerHTML = `
      <div class="calc">
        <div class="calc-display"><span class="calc-display-value">0</span></div>
        <div class="calc-grid">
          <button data-act="clear" class="calc-btn calc-fn">C</button>
          <button data-act="sign" class="calc-btn calc-fn">±</button>
          <button data-act="percent" class="calc-btn calc-fn">%</button>
          <button data-act="op" data-op="/" class="calc-btn calc-op">÷</button>
          <button data-act="digit" data-val="7" class="calc-btn">7</button>
          <button data-act="digit" data-val="8" class="calc-btn">8</button>
          <button data-act="digit" data-val="9" class="calc-btn">9</button>
          <button data-act="op" data-op="*" class="calc-btn calc-op">×</button>
          <button data-act="digit" data-val="4" class="calc-btn">4</button>
          <button data-act="digit" data-val="5" class="calc-btn">5</button>
          <button data-act="digit" data-val="6" class="calc-btn">6</button>
          <button data-act="op" data-op="-" class="calc-btn calc-op">−</button>
          <button data-act="digit" data-val="1" class="calc-btn">1</button>
          <button data-act="digit" data-val="2" class="calc-btn">2</button>
          <button data-act="digit" data-val="3" class="calc-btn">3</button>
          <button data-act="op" data-op="+" class="calc-btn calc-op">+</button>
          <button data-act="digit" data-val="0" class="calc-btn calc-zero">0</button>
          <button data-act="decimal" class="calc-btn">.</button>
          <button data-act="equals" class="calc-btn calc-equals">=</button>
        </div>
      </div>
    `;

    const displayEl = body.querySelector(".calc-display-value");
    let current = "0", stored = null, pendingOp = null, freshEntry = true;

    function updateDisplay(){
      displayEl.textContent = current;
      displayEl.style.fontSize = current.length > 9 ? "22px" : "34px";
    }
    function inputDigit(d){
      if(freshEntry){ current = d==="." ? "0." : d; freshEntry = false; }
      else if(current.length < 14){ current = (current==="0" && d!==".") ? d : current+d; }
      updateDisplay();
    }
    function inputDecimal(){
      if(freshEntry){ current="0."; freshEntry=false; }
      else if(!current.includes(".")){ current += "."; }
      updateDisplay();
    }
    function compute(a,b,op){
      if(op==="+") return a+b;
      if(op==="-") return a-b;
      if(op==="*") return a*b;
      if(op==="/") return b===0 ? NaN : a/b;
      return b;
    }
    function formatResult(n){
      if(!isFinite(n)) return "Error";
      let s = String(Math.round(n*1e10)/1e10);
      if(s.replace("-","").length > 14) s = n.toExponential(6);
      return s;
    }
    function setOperator(op){
      if(pendingOp!==null && !freshEntry){
        stored = compute(stored, parseFloat(current), pendingOp);
        current = formatResult(stored);
      }else{
        stored = parseFloat(current);
      }
      pendingOp = op;
      freshEntry = true;
      updateDisplay();
    }
    function equals(){
      if(pendingOp===null) return;
      const result = compute(stored, parseFloat(current), pendingOp);
      current = formatResult(result);
      stored = null; pendingOp = null; freshEntry = true;
      updateDisplay();
    }
    function clearAll(){
      current = "0"; stored = null; pendingOp = null; freshEntry = true;
      updateDisplay();
    }
    function toggleSign(){
      if(current!=="0") current = current.startsWith("-") ? current.slice(1) : "-"+current;
      updateDisplay();
    }
    function percent(){
      current = formatResult(parseFloat(current)/100);
      freshEntry = true;
      updateDisplay();
    }

    body.querySelectorAll(".calc-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const act = btn.dataset.act;
        if(act==="digit") inputDigit(btn.dataset.val);
        else if(act==="decimal") inputDecimal();
        else if(act==="op") setOperator(btn.dataset.op);
        else if(act==="equals") equals();
        else if(act==="clear") clearAll();
        else if(act==="sign") toggleSign();
        else if(act==="percent") percent();
      });
    });

    windowKeyHandlers[api.windowId] = function(e){
      if(/^[0-9]$/.test(e.key)){ inputDigit(e.key); e.preventDefault(); }
      else if(e.key==="."){ inputDecimal(); e.preventDefault(); }
      else if(["+","-","*","/"].includes(e.key)){ setOperator(e.key); e.preventDefault(); }
      else if(e.key==="Enter" || e.key==="="){ equals(); e.preventDefault(); }
      else if(e.key==="Escape"){ clearAll(); e.preventDefault(); }
      else if(e.key==="Backspace"){ current = current.length>1 ? current.slice(0,-1) : "0"; updateDisplay(); e.preventDefault(); }
    };
  }

  /* ============ APP: TODO ============ */
  async function renderTodoApp(body, api){
    body.innerHTML = `
      <div class="todo-app">
        <div class="todo-input-row">
          <input type="text" class="todo-input" placeholder="Add a task…" autocomplete="off">
          <div class="todo-add-btn" title="Add">+</div>
        </div>
        <div class="todo-filters">
          <button class="todo-filter active" data-filter="all">All</button>
          <button class="todo-filter" data-filter="active">Active</button>
          <button class="todo-filter" data-filter="done">Done</button>
        </div>
        <div class="todo-list"><div class="todo-empty">Loading…</div></div>
        <div class="todo-footer">
          <span class="todo-count">…</span>
          <span class="todo-clear">Clear completed</span>
        </div>
      </div>
    `;

    const input = body.querySelector(".todo-input");
    const addBtn = body.querySelector(".todo-add-btn");
    const listEl = body.querySelector(".todo-list");
    const countEl = body.querySelector(".todo-count");
    const clearEl = body.querySelector(".todo-clear");
    const filterBtns = body.querySelectorAll(".todo-filter");

    let filter = "all";
    let todos = [];

    // Load through the mediated storage API (namespaced per app, same
    // IndexedDB/localStorage engine as everything else) rather than a raw
    // shared localStorage key any app could collide with. One-time
    // migration of pre-AppManager data, same pattern as the desktop's own
    // legacy-blob migration.
    let loaded = await api.storage.get("tasks");
    if(loaded === null){
      try{
        const legacyRaw = localStorage.getItem("on369.todos.v1");
        if(legacyRaw){
          loaded = JSON.parse(legacyRaw);
          await api.storage.set("tasks", loaded);
        }
      }catch(e){ /* no legacy data, or it was malformed — start empty */ }
    }
    todos = Array.isArray(loaded) ? loaded : [];

    function persist(){
      api.storage.set("tasks", todos).catch(e=> console.warn("on369: todo save failed", e));
    }
    function checkSVG(){
      return `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"></path></svg>`;
    }

    function renderList(){
      const visible = todos.filter(t=>{
        if(filter==="active") return !t.done;
        if(filter==="done") return t.done;
        return true;
      });
      if(visible.length===0){
        listEl.innerHTML = `<div class="todo-empty">${todos.length===0 ? "No tasks yet — add one above." : "Nothing here."}</div>`;
      }else{
        listEl.innerHTML = visible.map(t=>`
          <div class="todo-item${t.done?" done":""}" data-id="${t.id}">
            <div class="todo-check">${checkSVG()}</div>
            <span class="todo-text">${escapeHtml(t.text)}</span>
            <div class="todo-del" title="Delete">&#10005;</div>
          </div>
        `).join("");
      }
      const remaining = todos.filter(t=>!t.done).length;
      countEl.textContent = `${remaining} item${remaining===1?"":"s"} left`;

      listEl.querySelectorAll(".todo-check, .todo-text").forEach(el=>{
        el.addEventListener("click", ()=>{
          const id = el.closest(".todo-item").dataset.id;
          const t = todos.find(x=>x.id===id);
          if(t){ t.done = !t.done; persist(); renderList(); }
        });
      });
      listEl.querySelectorAll(".todo-del").forEach(el=>{
        el.addEventListener("click", (e)=>{
          e.stopPropagation();
          const id = el.closest(".todo-item").dataset.id;
          todos = todos.filter(x=>x.id!==id);
          persist(); renderList();
        });
      });
    }

    function addTodo(){
      const text = input.value.trim();
      if(!text) return;
      todos.push({ id: uid(), text, done:false, createdAt: Date.now() });
      input.value = "";
      persist();
      renderList();
      input.focus();
    }

    addBtn.addEventListener("click", addTodo);
    input.addEventListener("keydown", (e)=>{
      if(e.key==="Enter") addTodo();
    });
    filterBtns.forEach(btn=>{
      btn.addEventListener("click", ()=>{
        filter = btn.dataset.filter;
        filterBtns.forEach(b=> b.classList.toggle("active", b===btn));
        renderList();
      });
    });
    clearEl.addEventListener("click", ()=>{
      todos = todos.filter(t=>!t.done);
      persist();
      renderList();
    });

    renderList();
  }

  /* ============ SEARCH BAR ============ */
  const ENGINES = {
    google:     { url: "https://www.google.com/search?q=",   domain: "google.com",      letter: "G", color: "#4A8DF0" },
    bing:       { url: "https://www.bing.com/search?q=",     domain: "bing.com",        letter: "B", color: "#008373" },
    duckduckgo: { url: "https://duckduckgo.com/?q=",         domain: "duckduckgo.com",  letter: "D", color: "#DE5833" },
    yahoo:      { url: "https://search.yahoo.com/search?p=", domain: "search.yahoo.com",letter: "Y", color: "#7B2FF7" }
  };
  let searchMode = "app";
  const searchInput = document.getElementById("searchInput");
  const enginePicker = document.getElementById("enginePicker");
  const searchModeWrap = document.getElementById("searchMode");

  if(!ENGINES[state.searchEngine]) state.searchEngine = "google";
  Object.keys(ENGINES).forEach(key=>{
    const eng = ENGINES[key];
    const btn = document.createElement("div");
    btn.className = "engine-btn" + (key === state.searchEngine ? " active" : "");
    btn.dataset.engine = key;
    btn.title = key.charAt(0).toUpperCase() + key.slice(1);

    // Real logo, fetched live: DuckDuckGo's icon service first (it 404s cleanly
    // on a miss), Google's favicon service second, colored letter as the final
    // offline-safe fallback. Built via DOM methods (not innerHTML/inline
    // onerror) so there's no HTML-attribute string-escaping to get wrong.
    const img = document.createElement("img");
    img.alt = eng.letter;
    img.src = `https://icons.duckduckgo.com/ip3/${eng.domain}.ico`;
    img.onerror = function(){
      img.onerror = function(){
        btn.innerHTML = "";
        btn.style.background = eng.color;
        btn.textContent = eng.letter;
      };
      img.src = `https://www.google.com/s2/favicons?sz=64&domain=${eng.domain}`;
    };
    btn.appendChild(img);

    btn.addEventListener("click", ()=>{
      state.searchEngine = key;
      enginePicker.querySelectorAll(".engine-btn").forEach(b=> b.classList.toggle("active", b.dataset.engine===key));
      save();
      searchInput.focus();
    });
    enginePicker.appendChild(btn);
  });

  searchModeWrap.querySelectorAll(".mode-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      searchMode = btn.dataset.mode;
      searchModeWrap.querySelectorAll(".mode-btn").forEach(b=> b.classList.toggle("active", b===btn));
      enginePicker.classList.toggle("visible", searchMode === "web");
      searchInput.placeholder = searchMode === "web" ? "Search the web…" : "Search your desktop…";
      if(searchMode === "app") applyAppSearch(searchInput.value);
      else clearAppSearch();
      searchInput.focus();
    });
  });

  searchInput.addEventListener("input", ()=>{
    if(searchMode === "app") applyAppSearch(searchInput.value);
  });
  searchInput.addEventListener("keydown", (e)=>{
    if(e.key === "Enter" && searchMode === "web") doWebSearch();
    if(e.key === "Escape"){ searchInput.value = ""; applyAppSearch(""); searchInput.blur(); }
  });
  document.getElementById("searchGo").addEventListener("click", ()=>{
    if(searchMode === "web") doWebSearch(); else searchInput.focus();
  });

  function doWebSearch(){
    const q = searchInput.value.trim();
    if(!q) return;
    const engine = ENGINES[state.searchEngine] || ENGINES.google;
    window.open(engine.url + encodeURIComponent(q), "_blank", "noopener");
  }

  function applyAppSearch(raw){
    const query = (raw || "").trim().toLowerCase();
    const rootItems = state.icons.filter(i=>i.parentId===null);
    let anyMatch = !query;
    gridLayer.querySelectorAll(".icon").forEach(el=>{
      const item = rootItems.find(i=>i.id===el.dataset.id);
      const match = !query || (item && item.label.toLowerCase().includes(query));
      el.style.display = match ? "" : "none";
      if(match) anyMatch = true;
    });
    if(query && !anyMatch){
      emptyHint.innerHTML = `No matches for "<b>${escapeHtml(raw.trim())}</b>"`;
      emptyHint.style.display = "block";
    }else if(!query){
      emptyHint.innerHTML = "Empty desktop.<br><b>Right-click</b> to add a bookmark or folder.";
      emptyHint.style.display = rootItems.length === 0 ? "block" : "none";
    }else{
      emptyHint.style.display = "none";
    }
  }
  function clearAppSearch(){
    gridLayer.querySelectorAll(".icon").forEach(el=> el.style.display = "");
    emptyHint.innerHTML = "Empty desktop.<br><b>Right-click</b> to add a bookmark or folder.";
    emptyHint.style.display = state.icons.filter(i=>i.parentId===null).length === 0 ? "block" : "none";
  }

  // Diagnostic hook for the browser console / devtools — NOT the API apps
  // use (that's AppAPI, mediated per-app via buildAPI). This just exposes
  // the internal managers for inspection, same idea as tools that expose a
  // devtools hook without it being part of the real public surface.
  window.__on369 = { AppManager, EventBus, Store };

  /* ============ INIT ============ */
  const initTimeout = new Promise((_, reject)=>{
    setTimeout(()=> reject(new Error("on369: initialization timed out")), 6000);
  });
  Promise.race([loadAndInit(), initTimeout]).then(()=>{
    applyAppearance();
    applyIconScale();
    render();
  }).catch(err=>{
    console.error("on369: initialization failed or timed out, recovering with in-memory defaults", err);
    // Last-resort recovery: whatever got this far stays (state.icons may
    // already be partially populated); anything still missing gets seeded
    // fresh, so the desktop is usable even if storage never came up.
    if(state.icons.length === 0) applySeedInto(state);
    state.icons.forEach(item=> persistedSnapshot.set(item.id, snapshotBody(item)));
    applyAppearance();
    applyIconScale();
    render();
  });

  let resizeTimer = null;
  window.addEventListener("resize", ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{ applyIconScale(); render(); }, 120);
  });

})();
</script>

<!DOCTYPE html>
<html lang="en" data-theme="verdant" data-wallpaper="dots">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>on369 — Your Desktop</title>

<style>
  :root{
    --font-display: -apple-system, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    --font-body: -apple-system, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;

    --cell-w-base: 104px;
    --cell-h-base: 118px;
    --icon-size-base: 56px;
    --cell-w: 104px;
    --cell-h: 118px;
    --icon-size: 56px;
    --radius: 14px;
    --topbar-h: 44px;
    --searchbar-h: 58px;

    /* Safe-area insets (notches, gesture bars, rounded-corner screens).
       Defined once here so JS can read the resolved pixel value the same
       way it already reads --topbar-h/--searchbar-h via getComputedStyle. */
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
  }

  @media (max-width: 640px){
    :root{
      --cell-w-base: 80px;
      --cell-h-base: 94px;
      --icon-size-base: 46px;
      --topbar-h: 40px;
      --searchbar-h: 54px;
    }
  }

  /* Short + wide viewport (phone rotated to landscape): topbar+searchbar
     together shouldn't eat a huge share of the little vertical room there is. */
  @media (orientation: landscape) and (max-height: 480px){
    :root{
      --topbar-h: 36px;
      --searchbar-h: 44px;
      --cell-h-base: 84px;
    }
  }
  @media (max-width: 380px){
    :root{
      --cell-w-base: 72px;
      --cell-h-base: 88px;
      --icon-size-base: 42px;
    }
  }

  /* ---------- THEME: noctis (dark, cool) ---------- */
  html[data-theme="noctis"]{
    --bg-0: #0c0e13;
    --bg-1: #12151c;
    --bg-glow: rgba(124,159,255,0.10);
    --glow-1: rgba(124,159,255,0.16);
    --glow-2: rgba(242,166,90,0.10);
    --surface: rgba(255,255,255,0.055);
    --surface-hover: rgba(255,255,255,0.10);
    --surface-selected: rgba(124,159,255,0.18);
    --border: rgba(255,255,255,0.09);
    --border-strong: rgba(255,255,255,0.18);
    --text-primary: #e9ebf1;
    --text-secondary: #8b90a0;
    --text-tertiary: #5a5f6d;
    --accent: #7c9fff;
    --accent-strong: #a4bcff;
    --warm: #f2a65a;
    --danger: #ea6b83;
    --dot: rgba(255,255,255,0.055);
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
    --shadow-soft: 0 2px 8px rgba(0,0,0,0.25);
    --scrollbar: rgba(255,255,255,0.15);
    --swatch-a: #12151c;
    --swatch-b: #7c9fff;
  }

  /* ---------- THEME: daylight (light, clean) ---------- */
  html[data-theme="daylight"]{
    --bg-0: #eef0f4;
    --bg-1: #e4e7ee;
    --bg-glow: rgba(90,120,255,0.08);
    --glow-1: rgba(90,120,255,0.14);
    --glow-2: rgba(217,138,61,0.08);
    --surface: rgba(255,255,255,0.65);
    --surface-hover: rgba(255,255,255,0.9);
    --surface-selected: rgba(90,120,255,0.16);
    --border: rgba(20,25,40,0.08);
    --border-strong: rgba(20,25,40,0.16);
    --text-primary: #1b1e27;
    --text-secondary: #5c6070;
    --text-tertiary: #8a8e9c;
    --accent: #4f6fe0;
    --accent-strong: #3a56c9;
    --warm: #d98a3d;
    --danger: #d64a63;
    --dot: rgba(20,25,40,0.07);
    --shadow: 0 8px 24px rgba(30,35,60,0.12);
    --shadow-soft: 0 2px 8px rgba(30,35,60,0.08);
    --scrollbar: rgba(20,25,40,0.15);
    --swatch-a: #eef0f4;
    --swatch-b: #4f6fe0;
  }

  /* ---------- THEME: dune (warm dusk) ---------- */
  html[data-theme="dune"]{
    --bg-0: #201a14;
    --bg-1: #2a2219;
    --bg-glow: rgba(212,160,84,0.10);
    --glow-1: rgba(212,160,84,0.16);
    --glow-2: rgba(91,138,130,0.12);
    --surface: rgba(255,247,235,0.055);
    --surface-hover: rgba(255,247,235,0.10);
    --surface-selected: rgba(212,160,84,0.20);
    --border: rgba(255,247,235,0.09);
    --border-strong: rgba(255,247,235,0.18);
    --text-primary: #f0e6d8;
    --text-secondary: #b3a189;
    --text-tertiary: #7d7061;
    --accent: #d4a054;
    --accent-strong: #e0b471;
    --warm: #5b8a82;
    --danger: #e08a6b;
    --dot: rgba(255,247,235,0.06);
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
    --shadow-soft: 0 2px 8px rgba(0,0,0,0.25);
    --scrollbar: rgba(255,247,235,0.15);
    --swatch-a: #201a14;
    --swatch-b: #d4a054;
  }

  /* ---------- THEME: graphite (quiet, neutral) ---------- */
  html[data-theme="graphite"]{
    --bg-0: #1b1e23;
    --bg-1: #23262c;
    --bg-glow: rgba(143,160,184,0.08);
    --glow-1: rgba(143,160,184,0.12);
    --glow-2: rgba(143,160,184,0.06);
    --surface: rgba(255,255,255,0.05);
    --surface-hover: rgba(255,255,255,0.09);
    --surface-selected: rgba(143,160,184,0.18);
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.16);
    --text-primary: #e4e6ea;
    --text-secondary: #8b909c;
    --text-tertiary: #585c65;
    --accent: #8fa0b8;
    --accent-strong: #aebbcd;
    --warm: #b8a088;
    --danger: #d9788a;
    --dot: rgba(255,255,255,0.05);
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
    --shadow-soft: 0 2px 8px rgba(0,0,0,0.25);
    --scrollbar: rgba(255,255,255,0.14);
    --swatch-a: #1b1e23;
    --swatch-b: #8fa0b8;
  }

  /* ---------- THEME: verdant (deep forest) ---------- */
  html[data-theme="verdant"]{
    --bg-0: #0f1a14;
    --bg-1: #16241c;
    --bg-glow: rgba(108,196,153,0.09);
    --glow-1: rgba(108,196,153,0.15);
    --glow-2: rgba(212,176,106,0.09);
    --surface: rgba(228,237,231,0.055);
    --surface-hover: rgba(228,237,231,0.10);
    --surface-selected: rgba(108,196,153,0.18);
    --border: rgba(228,237,231,0.09);
    --border-strong: rgba(228,237,231,0.17);
    --text-primary: #e4ede7;
    --text-secondary: #90a89b;
    --text-tertiary: #5c7267;
    --accent: #6cc499;
    --accent-strong: #8ed4b2;
    --warm: #d4b06a;
    --danger: #e08a7a;
    --dot: rgba(228,237,231,0.055);
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
    --shadow-soft: 0 2px 8px rgba(0,0,0,0.25);
    --scrollbar: rgba(228,237,231,0.15);
    --swatch-a: #0f1a14;
    --swatch-b: #6cc499;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family: var(--font-body);
    color: var(--text-primary);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* Respect the OS-level "reduce motion" preference: this is the standard
     blanket approach (rather than annotating every transition individually),
     so any future animation automatically inherits the same guarantee. */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* Universal keyboard-focus ring. Mouse/touch interaction never triggers
     :focus-visible, so this only appears for keyboard users — no visual
     change for pointer-driven use. */
  :focus-visible{
    outline: 2.5px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .icon:focus-visible{
    outline-offset: -2px;
    background: var(--surface-selected);
  }

  /* ---------- WALLPAPER ---------- */
  #desktop{
    position: relative;
    width: 100vw;
    height: 100vh;
    background: var(--bg-0);
    overflow: auto;
  }
  html[data-wallpaper="dots"] #desktop{
    background-image:
      radial-gradient(circle at 18% 12%, var(--bg-glow), transparent 45%),
      radial-gradient(circle at 82% 88%, var(--bg-glow), transparent 40%),
      radial-gradient(var(--dot) 1.4px, transparent 1.4px);
    background-color: var(--bg-0);
    background-size: auto, auto, 26px 26px;
  }
  html[data-wallpaper="aurora"] #desktop{
    background:
      radial-gradient(ellipse 60% 40% at 20% 0%, var(--glow-1), transparent 60%),
      radial-gradient(ellipse 50% 35% at 85% 15%, var(--glow-2), transparent 60%),
      radial-gradient(ellipse 60% 50% at 50% 100%, var(--glow-1), transparent 60%),
      var(--bg-0);
  }
  html[data-wallpaper="grid"] #desktop{
    background-image:
      radial-gradient(circle at 50% 0%, var(--bg-glow), transparent 55%),
      linear-gradient(var(--dot) 1px, transparent 1px),
      linear-gradient(90deg, var(--dot) 1px, transparent 1px);
    background-color: var(--bg-0);
    background-size: auto, 52px 52px, 52px 52px;
  }

  #desktop::-webkit-scrollbar{ width: 10px; height:10px; }
  #desktop::-webkit-scrollbar-thumb{ background: var(--scrollbar); border-radius: 8px; }
  #folderBody::-webkit-scrollbar{ width: 9px; }
  #folderBody::-webkit-scrollbar-thumb{ background: var(--scrollbar); border-radius: 8px; }

  /* ---------- TOP BAR ---------- */
  #topbar{
    position: fixed; top: 0; left: 0; right: 0;
    height: calc(var(--topbar-h) + var(--safe-top));
    padding-top: var(--safe-top);
    display: flex; align-items: center; justify-content: space-between;
    padding-left: calc(16px + var(--safe-left));
    padding-right: calc(16px + var(--safe-right));
    z-index: 500;
    pointer-events: none;
  }
  #topbar > *{ pointer-events: auto; }
  .brand{
    display:flex; align-items:center; gap:8px;
  }
  .brand-logo{
    height: 28px;
    width: auto;
    display: block;
    flex-shrink: 0;
  }
  @media (max-width: 640px){
    .brand-logo{ height: 23px; }
  }

  .topbar-right{ display:flex; align-items:center; gap:10px; }

  #clock{
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 10px;
    backdrop-filter: blur(10px);
    display:flex; gap:8px; align-items:baseline;
    letter-spacing: 0.02em;
  }
  #clock .date{ color: var(--text-tertiary); }

  .iconbtn{
    width: 32px; height: 32px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
    color: var(--text-secondary);
    backdrop-filter: blur(10px);
    transition: background .12s ease, color .12s ease, transform .08s ease;
  }
  .iconbtn:hover{ background: var(--surface-hover); color: var(--text-primary); }
  .iconbtn:active{ transform: scale(0.94); }
  .iconbtn svg{ width:16px; height:16px; }

  /* ---------- SEARCH BAR ---------- */
  #searchBar{
    position: fixed;
    top: calc(var(--topbar-h) + var(--safe-top));
    left: 0; right: 0;
    height: var(--searchbar-h);
    z-index: 480;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 calc(16px + var(--safe-right)) 0 calc(16px + var(--safe-left));
    pointer-events: none;
  }
  #searchBar > *{ pointer-events: auto; }
  .search-shell{
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 560px;
    height: 44px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0 8px 0 6px;
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow-soft), 0 0 0 1px transparent;
    transition: box-shadow .18s ease, border-color .18s ease;
  }
  .search-shell:focus-within{
    border-color: var(--border-strong);
    box-shadow: var(--shadow-soft), 0 0 0 3px var(--surface-selected);
  }
  .search-mode{
    display: flex;
    background: var(--bg-0);
    border-radius: 9px;
    padding: 2px;
    gap: 2px;
    flex-shrink: 0;
  }
  .mode-btn{
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    padding: 7px 11px;
    border-radius: 7px;
    cursor: pointer;
  }
  .mode-btn.active{ background: var(--accent); color: #fff; }

  .engine-picker{
    display: none;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    padding: 0 2px;
  }
  .engine-picker.visible{ display: flex; }
  .engine-btn{
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1.5px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-size: 10px;
    font-weight: 800;
    color: #fff;
    background: #fff;
    cursor: pointer;
    opacity: 0.55;
    transform: scale(0.92);
    overflow: hidden;
    flex-shrink: 0;
    transition: opacity .12s ease, transform .12s ease, border-color .12s ease;
  }
  .engine-btn img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .engine-btn.active{ opacity: 1; transform: scale(1); border-color: var(--text-primary); }

  .search-input-wrap{
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 6px;
  }
  .search-input-wrap svg{ width:16px; height:16px; color: var(--text-tertiary); flex-shrink:0; }
  #searchInput{
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 14px;
    outline: none;
    user-select: text;
    -webkit-user-select: text;
  }
  #searchInput::placeholder{ color: var(--text-tertiary); }
  #searchGo{
    width: 32px; height: 32px;
    flex-shrink: 0;
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  #searchGo:hover{ background: var(--accent-strong); border-color: var(--accent-strong); }

  @media (max-width: 640px){
    .search-shell{ max-width: 100%; height: 40px; gap: 6px; }
    .mode-btn{ padding: 6px 8px; font-size: 10.5px; }
    #searchInput{ font-size: 14px; }
    .engine-btn{ width: 20px; height: 20px; font-size: 9px; }
    #searchGo{ width: 28px; height: 28px; }
  }

  /* ---------- SETTINGS POPOVER ---------- */
  #settingsPop{
    position: fixed;
    top: 52px; right: 16px;
    width: 264px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 16px;
    z-index: 900;
    display: none;
    backdrop-filter: blur(16px);
    max-height: calc(100vh - 68px);
    overflow-y: auto;
  }
  #settingsPop.open{ display:block; }
  .pop-label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    font-weight: 700;
    margin: 4px 0 9px;
  }
  .theme-grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    margin-bottom: 16px;
  }
  .theme-card{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
  }
  .theme-swatch{
    width: 100%;
    height: 42px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    position: relative;
    transition: border-color .12s ease, transform .12s ease;
  }
  .theme-card:hover .theme-swatch{ transform: translateY(-1px); }
  .theme-card.active .theme-swatch{
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--surface-selected);
  }
  .theme-swatch .dot{
    position: absolute; right: 6px; bottom: 6px;
    width: 9px; height: 9px; border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.18);
  }
  .theme-name{
    font-size: 10px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .theme-card.active .theme-name{ color: var(--text-primary); }

  .wp-row{ display:flex; gap:8px; }
  .wp-swatch{
    flex:1; height:34px; border-radius:8px; cursor:pointer;
    border: 1.5px solid var(--border);
    transition: border-color .12s ease;
  }
  .wp-swatch.active{ border-color: var(--accent); }
  .wp-swatch.wp-dots{ background: radial-gradient(circle, var(--accent) 1px, transparent 1.2px) 0 0/8px 8px, var(--bg-0); }
  .wp-swatch.wp-aurora{ background: radial-gradient(ellipse at 30% 20%, color-mix(in srgb, var(--accent) 55%, transparent), transparent 65%), var(--bg-0); }
  .wp-swatch.wp-grid{ background: linear-gradient(var(--border-strong) 1px, transparent 1px) 0 0/9px 9px, linear-gradient(90deg,var(--border-strong) 1px, transparent 1px) 0 0/9px 9px, var(--bg-0); }

  .icon-size-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .icon-size-row .iconbtn{ width: 30px; height: 30px; flex-shrink: 0; }
  .icon-size-row .iconbtn svg{ width: 15px; height: 15px; }
  #iconSizeReadout{
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text-secondary);
    min-width: 40px;
    text-align: center;
  }

  /* ---------- GRID / ICONS ---------- */
  #gridLayer{
    position: relative;
    min-height: 100vh;
  }

  .icon{
    position: absolute;
    width: var(--cell-w);
    height: var(--cell-h);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding-top: 10px;
    border-radius: 12px;
    cursor: default;
    touch-action: none;
    transition: left .16s cubic-bezier(.2,.8,.3,1), top .16s cubic-bezier(.2,.8,.3,1), background .12s ease;
  }
  .icon.dragging{ transition: none; z-index: 50; opacity: 0.92; }
  .icon.dragging .glyph-wrap{ transform: none; }
  .icon.dragging .icon-glyph{ box-shadow: var(--shadow); }
  .icon:hover{ background: var(--surface); }
  .icon.selected{ background: var(--surface-selected); }
  .icon.cut-pending{ opacity: 0.45; }
  .icon.drop-target .icon-glyph{
    outline: 2.5px solid var(--accent);
    outline-offset: 2px;
    background: var(--surface-selected);
  }
  .icon:hover .glyph-wrap{ transform: translateY(-3px); }
  .icon:hover .icon-glyph{ box-shadow: var(--shadow); }

  .select-check{
    position: absolute;
    top: 2px;
    right: 2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--bg-1);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    z-index: 2;
  }
  .select-check svg{ width: 12px; height: 12px; }
  .select-check.checked{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .refresh-pulse{ animation: refreshPulse 0.5s ease; }
  @keyframes refreshPulse{ 0%{ opacity: 0.35; } 100%{ opacity: 1; } }

  .glyph-wrap{ position: relative; transition: transform .16s cubic-bezier(.2,.8,.3,1); }
  .icon-glyph{
    width: var(--icon-size);
    height: var(--icon-size);
    border-radius: 13px;
    display:flex; align-items:center; justify-content:center;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
    position: relative;
    overflow: hidden;
    transition: transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .16s ease;
  }
  .icon-glyph img{ width: 60%; height:60%; object-fit:contain; border-radius:4px; }
  .icon-glyph svg{ width: 60%; height: 60%; }
  .icon-glyph .letter{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    color: var(--text-primary);
  }
  .icon-glyph .count-badge{
    position: absolute; top: -4px; right: -4px;
    min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 8px;
    background: var(--bg-1);
    border: 1.5px solid var(--bg-0);
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    overflow: visible;
  }

  .icon-label{
    font-size: 11.5px;
    color: var(--text-primary);
    text-align: center;
    max-width: 92px;
    line-height: 1.25;
    padding: 2px 6px;
    border-radius: 5px;
    word-break: break-word;
    max-height: 2.6em;
    overflow: hidden;
  }
  .icon.selected .icon-label{ background: var(--accent); color: #fff; }
  .icon-label[contenteditable="true"]{
    background: var(--bg-1);
    color: var(--text-primary);
    outline: 1.5px solid var(--accent);
    user-select: text;
    -webkit-user-select: text;
    max-height: none;
    overflow: visible;
  }
  @media (max-width: 640px){
    .icon-label{ font-size: 10.5px; max-width: 70px; }
  }

  /* ---------- RUBBER BAND ---------- */
  #rubberband{
    position: absolute;
    border: 1px solid var(--accent);
    background: var(--surface-selected);
    display: none;
    z-index: 40;
    border-radius: 3px;
    pointer-events: none;
  }

  /* ---------- CONTEXT MENU ---------- */
  .ctx-menu{
    position: fixed;
    min-width: 190px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 6px;
    /* Above every other layer, including .overlay (2000) and #folderOverlay
       (1500) — a context menu is invoked on demand and should always land
       on top of whatever's already open, the same way it would in a real
       desktop OS. Previously this sat at 1000, below folderOverlay, which
       made right-clicking inside an open folder produce a menu that was
       rendered but not clickable (the folder panel intercepted the click). */
    z-index: 2100;
    backdrop-filter: blur(16px);
  }
  .ctx-item{
    padding: 8px 10px;
    font-size: 13px;
    color: var(--text-primary);
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .ctx-item:hover{ background: var(--surface-hover); }
  .ctx-item.danger{ color: var(--danger); }
  .ctx-item[aria-expanded="true"]{ background: var(--surface-hover); }
  .ctx-sep{ height:1px; background: var(--border); margin: 6px 4px; }
  .ctx-hint{ color: var(--text-tertiary); font-size: 11px; flex-shrink:0; }
  .ctx-main{ display:flex; align-items:center; gap:9px; min-width:0; }
  .ctx-main span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ctx-icon{ width:15px; height:15px; flex-shrink:0; display:flex; color: var(--text-tertiary); }
  .ctx-icon svg{ width:15px; height:15px; }
  .ctx-item.danger .ctx-icon{ color: var(--danger); }
  .ctx-chevron{ width:14px; height:14px; flex-shrink:0; display:flex; color: var(--text-tertiary); }
  .ctx-chevron svg{ width:14px; height:14px; }

  /* ---------- FAB ---------- */
  #fab{
    position: fixed;
    right: calc(22px + var(--safe-right)); bottom: calc(22px + var(--safe-bottom));
    width: 50px; height: 50px;
    border-radius: 16px;
    background: var(--accent);
    color: #fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow);
    cursor: pointer;
    z-index: 600;
    transition: transform .1s ease, border-radius .15s ease, bottom .16s ease;
  }
  #fab:hover{ transform: translateY(-2px); }
  #fab:active{ transform: scale(0.94); }
  #fab svg{ width: 22px; height: 22px; }
  body.has-taskbar #fab{ bottom: calc(76px + var(--safe-bottom)); }

  /* ---------- STATUS ---------- */
  #status{
    position: fixed;
    left: calc(16px + var(--safe-left)); bottom: calc(16px + var(--safe-bottom));
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-tertiary);
    z-index: 400;
    transition: bottom .16s ease;
  }
  body.has-taskbar #status{ bottom: calc(68px + var(--safe-bottom)); }

  /* ---------- WINDOW MANAGER ---------- */
  #windowLayer{
    position: fixed;
    inset: 0;
    z-index: 90;
    pointer-events: none;
  }
  .oswindow{
    position: fixed;
    display: flex;
    flex-direction: column;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    pointer-events: auto;
    min-width: 220px;
    min-height: 180px;
  }
  .oswindow-titlebar{
    flex-shrink: 0;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px 0 12px;
    background: var(--bg-0);
    border-bottom: 1px solid var(--border);
    cursor: default;
    touch-action: none;
    user-select: none;
  }
  .oswindow-title{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-primary);
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .oswindow-icon{ width: 16px; height:16px; flex-shrink:0; display:flex; }
  .oswindow-icon svg{ width:16px; height:16px; }
  .oswindow-controls{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .win-btn{
    width: 24px; height: 24px;
    border-radius: 7px;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-secondary);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }
  .win-btn:hover{ background: var(--surface-hover); color: var(--text-primary); }
  .win-btn.win-close:hover{ background: var(--danger); color: #fff; }
  .oswindow-body{
    flex: 1;
    min-height: 0;
    overflow: auto;
    position: relative;
  }
  .oswindow-resize{
    position: absolute;
    right: 0; bottom: 0;
    width: 18px; height: 18px;
    cursor: nwse-resize;
    touch-action: none;
  }
  .oswindow-resize::after{
    content:"";
    position:absolute; right:4px; bottom:4px;
    width:8px; height:8px;
    border-right: 2px solid var(--border-strong);
    border-bottom: 2px solid var(--border-strong);
    border-radius: 0 0 2px 0;
  }

  /* ---------- TASKBAR ---------- */
  #taskbar{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: calc(54px + var(--safe-bottom));
    padding-bottom: var(--safe-bottom);
    z-index: 480;
    display: none;
    align-items: center;
    gap: 8px;
    padding-left: calc(14px + var(--safe-left));
    padding-right: calc(14px + var(--safe-right));
    background: var(--bg-1);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(16px);
    overflow-x: auto;
  }
  body.has-taskbar #taskbar{ display: flex; }
  .taskbar-pill{
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 7px;
    height: 36px;
    padding: 0 10px 0 8px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    max-width: 170px;
  }
  .taskbar-pill.active{ border-color: var(--border-strong); background: var(--surface-hover); }
  .taskbar-pill .tb-icon{ width:15px; height:15px; flex-shrink:0; display:flex; }
  .taskbar-pill .tb-icon svg{ width:15px; height:15px; }
  .taskbar-pill .tb-label{
    font-size: 12px; font-weight: 600; color: var(--text-primary);
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  }
  .taskbar-pill .tb-close{
    color: var(--text-tertiary);
    font-size: 11px;
    width: 16px; height:16px;
    border-radius: 5px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink: 0;
  }
  .taskbar-pill .tb-close:hover{ background: var(--danger); color:#fff; }

  /* ---------- APP PICKER ---------- */
  #appPickerList{ max-height: 280px; overflow-y: auto; margin: 2px -2px; padding: 0 2px; }
  .app-pick-row{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 4px;
  }
  .app-pick-row:hover{ background: var(--surface-hover); }
  .app-pick-icon{
    width: 34px; height: 34px;
    border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .app-pick-icon svg{ width: 20px; height: 20px; }
  .app-pick-row span{ font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .import-summary{
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-bottom: 14px;
    padding: 10px 12px;
    background: var(--bg-0);
    border-radius: 9px;
    border: 1px solid var(--border);
  }
  .import-summary b{ color: var(--text-primary); }

  /* ---------- MOVE TO PICKER ---------- */
  #movePickerList{ max-height: 320px; overflow-y: auto; margin: 2px -2px; padding: 0 2px; }
  .move-row{
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 10px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 4px;
    border: none;
    background: none;
    font: inherit;
    text-align: left;
    color: var(--text-primary);
  }
  .move-row:hover{ background: var(--surface-hover); }
  .move-row .ctx-icon{ width: 18px; height: 18px; color: var(--text-tertiary); }
  .move-row .ctx-icon svg{ width: 18px; height: 18px; }
  .move-row span{ font-size: 13px; font-weight: 600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .move-empty{ font-size: 12.5px; color: var(--text-tertiary); text-align:center; padding: 20px 8px; }

  @media (max-width: 640px){
    .oswindow{ border-radius: 12px; }
    #taskbar{ height: calc(50px + var(--safe-bottom)); padding-left: calc(10px + var(--safe-left)); padding-right: calc(10px + var(--safe-right)); }
    .taskbar-pill{ max-width: 130px; height: 34px; }
    body.has-taskbar #fab{ bottom: calc(70px + var(--safe-bottom)); }
    body.has-taskbar #status{ bottom: calc(64px + var(--safe-bottom)); }
  }

  /* ---------- CALCULATOR APP ---------- */
  .calc{
    display: flex;
    flex-direction: column;
    height: 100%;
    background: var(--bg-1);
  }
  .calc-display{
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 18px 16px;
    min-height: 64px;
  }
  .calc-display-value{
    font-family: var(--font-mono);
    font-size: 34px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1;
    word-break: break-all;
    text-align: right;
    transition: font-size .1s ease;
  }
  .calc-grid{
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 1px;
    background: var(--border);
    border-top: 1px solid var(--border);
  }
  .calc-btn{
    border: none;
    background: var(--bg-1);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .calc-btn:hover{ background: var(--surface-hover); }
  .calc-btn:active{ background: var(--surface-selected); }
  .calc-btn.calc-fn{ color: var(--text-secondary); }
  .calc-btn.calc-op{ color: var(--accent); font-size: 18px; }
  .calc-btn.calc-equals{ background: var(--accent); color: #fff; }
  .calc-btn.calc-equals:hover{ background: var(--accent-strong); }
  .calc-btn.calc-zero{ grid-column: span 2; }

  /* ---------- TODO APP ---------- */
  .todo-app{
    display: flex;
    flex-direction: column;
    height: 100%;
    background: var(--bg-1);
  }
  .todo-input-row{
    display: flex;
    gap: 8px;
    padding: 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .todo-input{
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border-strong);
    background: var(--bg-0);
    color: var(--text-primary);
    border-radius: 9px;
    padding: 9px 11px;
    font-size: 13px;
    font-family: var(--font-body);
    outline: none;
  }
  .todo-input:focus{ outline: 1.5px solid var(--accent); }
  .todo-add-btn{
    width: 36px; height: 36px;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 18px;
    font-weight: 700;
  }
  .todo-add-btn:hover{ background: var(--accent-strong); }
  .todo-filters{
    display: flex;
    gap: 4px;
    padding: 8px 12px;
    flex-shrink: 0;
  }
  .todo-filter{
    border: none;
    background: var(--bg-0);
    color: var(--text-secondary);
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 7px;
    cursor: pointer;
  }
  .todo-filter.active{ background: var(--accent); color: #fff; }
  .todo-list{
    flex: 1;
    overflow-y: auto;
    padding: 2px 8px 8px;
  }
  .todo-item{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 8px;
    border-radius: 9px;
    cursor: default;
  }
  .todo-item:hover{ background: var(--surface); }
  .todo-check{
    width: 18px; height: 18px;
    border-radius: 6px;
    border: 1.5px solid var(--border-strong);
    flex-shrink: 0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .todo-item.done .todo-check{ background: var(--accent); border-color: var(--accent); }
  .todo-check svg{ width: 12px; height: 12px; opacity: 0; }
  .todo-item.done .todo-check svg{ opacity: 1; }
  .todo-text{
    flex: 1;
    min-width: 0;
    font-size: 13px;
    color: var(--text-primary);
    word-break: break-word;
    cursor: pointer;
  }
  .todo-item.done .todo-text{ color: var(--text-tertiary); text-decoration: line-through; }
  .todo-del{
    width: 22px; height: 22px;
    border-radius: 6px;
    color: var(--text-tertiary);
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    opacity: 0.4;
    flex-shrink: 0;
  }
  .todo-item:hover .todo-del{ opacity: 1; }
  .todo-del:hover{ background: var(--danger); color: #fff; }
  .todo-empty{
    text-align: center;
    color: var(--text-tertiary);
    font-size: 12.5px;
    margin-top: 40px;
    padding: 0 20px;
  }
  .todo-footer{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 14px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .todo-count{ font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono); }
  .todo-clear{ font-size: 11px; color: var(--text-secondary); cursor: pointer; }
  .todo-clear:hover{ color: var(--text-primary); text-decoration: underline; }

  /* ---------- MODAL ---------- */
  .overlay{
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
  }
  .overlay.open{ display:flex; }
  .modal{
    width: 360px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .modal h3{
    margin: 0 0 14px;
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
  }
  .field{ margin-bottom: 12px; }
  .field label{
    display:block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-tertiary);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .field input[type=text], .field input[type=url]{
    width: 100%;
    padding: 9px 11px;
    border-radius: 9px;
    border: 1px solid var(--border-strong);
    background: var(--bg-0);
    color: var(--text-primary);
    font-size: 13px;
    font-family: var(--font-body);
    user-select: text;
    -webkit-user-select: text;
  }
  .field input:focus{ outline: 1.5px solid var(--accent); }
  .colorpicks{ display:flex; gap:8px; }
  .colorpick{
    width: 26px; height: 26px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
  }
  .colorpick.active{ border-color: var(--text-primary); }
  .modal-actions{
    display:flex; justify-content:flex-end; gap:8px; margin-top: 16px;
  }
  .btn{
    padding: 8px 16px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--text-primary);
  }
  .btn.primary{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn.danger{
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }
  .btn:hover{ opacity: 0.9; }
  .confirm-text{
    margin: 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-secondary);
  }

  /* ---------- FOLDER PANEL ---------- */
  #folderOverlay{
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display:none;
    align-items: center; justify-content: center;
    z-index: 1500;
  }
  #folderOverlay.open{ display:flex; }
  #folderPanel{
    width: 560px;
    max-width: 92vw;
    height: 420px;
    max-height: 80vh;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #folderHeader{
    padding: 14px 18px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom: 1px solid var(--border);
  }
  .folder-head-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  #folderHeader h3{
    margin:0; font-family: var(--font-display); font-size: 14px; font-weight:700;
    display:flex; align-items:center; gap:8px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #folderBody{
    position: relative;
    flex: 1;
    overflow: auto;
    padding: 20px;
  }
  #folderBody .empty-hint{
    color: var(--text-tertiary);
    font-size: 12.5px;
    text-align:center;
    margin-top: 60px;
  }

  /* ---------- EMPTY STATE ---------- */
  #emptyHint{
    position: fixed;
    top: 46%; left: 50%;
    transform: translate(-50%,-50%);
    text-align: center;
    color: var(--text-tertiary);
    font-size: 13px;
    pointer-events: none;
    z-index: 5;
    display: none;
  }
  #emptyHint b{ color: var(--text-secondary); }

  ::selection{ background: var(--accent); color:#fff; }
</style>
</head>
<body>

  <div class="brand">

<script>
(function(){
  "use strict";

  /* ============ STATE ============ */
  const STORAGE_KEY = "on369.state.v1"; // legacy single-blob format, read once for migration only
  const COLORS = ["#7c9fff","#f2a65a","#6bd1a0","#ea6b83","#c792ea","#57c7d4"];

  /* ============ EVENT BUS ============
     Inter-application messaging without apps knowing about each other's
     internals. A handler that throws is caught and logged, not allowed to
     break emit() for every other listener — the same "one app's failure
     shouldn't take down the rest" principle applied to messaging. */
  const EventBus = (function(){
    const listeners = new Map();
    function on(event, handler){
      if(!listeners.has(event)) listeners.set(event, new Set());
      listeners.get(event).add(handler);
      return ()=>{ const set = listeners.get(event); if(set) set.delete(handler); };
    }
    function off(event, handler){
      const set = listeners.get(event);
      if(set) set.delete(handler);
    }
    function emit(event, payload){
      const set = listeners.get(event);
      if(!set) return;
      set.forEach(handler=>{
        try{ handler(payload); }
        catch(e){ console.warn(`on369: EventBus handler for "${event}" threw`, e); }
      });
    }
    return { on, off, emit };
  })();

  /* ============ APPLICATION MANAGER ============
     Sits above the Window Manager, which stays exactly as it was — the low-
     level mechanism for creating/destroying/moving/resizing/focusing windows.
     AppManager owns registration, metadata, lifecycle orchestration, and the
     mediated API apps actually call into (see buildAPI), instead of apps
     reaching into shared globals directly. */
  const AppManager = (function(){
    const registry = new Map();  // appId -> full metadata record
    const running = new Map();   // appId -> { launchedAt }

    function register(meta){
      if(!meta || !meta.id || !meta.name || !meta.render){
        console.warn("on369: app registration requires at least id, name, render", meta);
        return null;
      }
      const record = {
        id: meta.id,
        name: meta.name,
        description: meta.description || "",
        version: meta.version || "1.0.0",
        developer: meta.developer || "on369",
        icon: meta.icon || (()=> ""),
        category: meta.category || "utilities",
        render: meta.render,
        permissions: meta.permissions || [],
        fileAssociations: meta.fileAssociations || [],
        shortcuts: meta.shortcuts || [],
        themeCompatible: meta.themeCompatible !== false,
        singleton: meta.singleton !== false,
        backgroundCapable: meta.backgroundCapable === true,
        defaultWidth: meta.defaultWidth || 320,
        defaultHeight: meta.defaultHeight || 420,
        minWidth: meta.minWidth || 260,
        minHeight: meta.minHeight || 320,
        maxWidth: meta.maxWidth || null,
        maxHeight: meta.maxHeight || null,
        resizable: meta.resizable !== false
      };
      registry.set(meta.id, record);
      return record;
    }

    function getMetadata(appId){ return registry.get(appId) || null; }
    function listApps(){ return Array.from(registry.values()); }
    function listByCategory(category){ return listApps().filter(a=>a.category===category); }
    function isRunning(appId){ return running.has(appId); }
    function listRunning(){ return Array.from(running.keys()); }

    // The controlled surface apps get instead of free access to shared
    // globals — storage is namespaced per app (via Store's appData store,
    // same IndexedDB-primary/localStorage-fallback engine as everything
    // else), not a raw shared localStorage key any app could collide with.
    function buildAPI(appId, windowId){
      return {
        appId, windowId,
        storage: {
          get: (key)=> Store.getAppData(appId, key),
          set: (key, value)=> Store.setAppData(appId, key, value)
        },
        close: ()=> AppManager.close(appId),
        minimize: ()=> minimizeWindow(windowId),
        notify: (message, kind)=>{
          // Architecture only, per the spec — no notification UI yet.
          console.info(`[on369 notification:${kind||"info"}] ${appId}: ${message}`);
          EventBus.emit("notification", { appId, message, kind: kind||"info", at: Date.now() });
        },
        on: (event, handler)=> EventBus.on(event, handler),
        emit: (event, payload)=> EventBus.emit(event, payload)
      };
    }

    function launch(appId, opts){
      opts = opts || {};
      const meta = registry.get(appId);
      if(!meta){ console.warn("on369: no app registered with id", appId); return; }
      if(meta.singleton && running.has(appId)){
        const win = windows.find(w=>w.id===appId);
        if(win) win.minimized = false;
        focusWindow(appId);
        EventBus.emit("app:focus", { appId });
        return;
      }
      openWindow(appId, opts.title || meta.name, opts.color || COLORS[0]);
      running.set(appId, { launchedAt: Date.now() });
      EventBus.emit("app:launch", { appId });
    }

    function close(appId){
      closeWindow(appId); // closeWindow itself calls notifyClosed — single source of truth regardless of entry point
    }

    function notifyClosed(appId){
      if(running.has(appId)){
        running.delete(appId);
        EventBus.emit("app:close", { appId });
      }
    }

    return { register, getMetadata, listApps, listByCategory, isRunning, listRunning, buildAPI, launch, close, notifyClosed };
  })();

  AppManager.register({
    id: "calculator",
    name: "Calculator",
    description: "A standard four-function calculator.",
    version: "1.0.0",
    developer: "on369",
    category: "utilities",
    icon: calculatorSVG,
    render: renderCalculatorApp,
    permissions: [],
    fileAssociations: [],
    shortcuts: [],
    defaultWidth: 300, defaultHeight: 420,
    minWidth: 260, minHeight: 360,
    maxWidth: 480, maxHeight: 680,
    resizable: true,
    singleton: true,
    backgroundCapable: false
  });

  AppManager.register({
    id: "todo",
    name: "Todo",
    description: "A simple task list with filtering and completion tracking.",
    version: "1.0.0",
    developer: "on369",
    category: "productivity",
    icon: todoSVG,
    render: renderTodoApp,
    permissions: ["storage"],
    fileAssociations: [".todo"],
    shortcuts: [],
    defaultWidth: 320, defaultHeight: 460,
    minWidth: 260, minHeight: 320,
    maxWidth: 520, maxHeight: 720,
    resizable: true,
    singleton: true,
    backgroundCapable: false
  });



  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

  /* ---------- ITEM MODEL ----------
     Every desktop object shares one base shape; type-specific subclasses add
     only what's unique to them. Adding a future type (Note, Widget, File)
     means one new small class + one registry entry — nothing else in the
     app needs to change to accommodate it.

     Field note: the base model's "Name" concept is implemented as `label`
     here (matching every existing call site — rename, search, ARIA labels,
     the .icon-label DOM node) rather than renamed to `name`, to avoid a
     pure-cosmetic rename across ~20 locations on top of an already
     substantial storage-layer change. "Icon" isn't a stored field — glyphs
     are derived from type+color+url/appId (see glyphFor) rather than
     uploaded, so there's nothing to persist there yet. */
  class DesktopItem{
    constructor(opts){
      opts = opts || {};
      this.id = opts.id || uid();
      this.label = opts.label || "Untitled";
      this.color = opts.color || COLORS[0];
      this.x = opts.x ?? 0;
      this.y = opts.y ?? 0;
      this.parentId = opts.parentId ?? null;
      this.createdAt = opts.createdAt || Date.now();
      this.modifiedAt = opts.modifiedAt || this.createdAt;
      this.metadata = opts.metadata || {};
      this.tags = opts.tags || [];
      this.visible = opts.visible !== false;
    }
  }
  class BookmarkItem extends DesktopItem{
    constructor(opts){ super(opts); this.type = "bookmark"; this.url = opts.url || ""; }
  }
  class FolderItem extends DesktopItem{
    constructor(opts){ super(opts); this.type = "folder"; }
  }
  class AppItem extends DesktopItem{
    constructor(opts){ super(opts); this.type = "app"; this.appId = opts.appId; }
  }
  // A URL-based "app" — distinct from AppItem (which points at a built-in
  // APP_REGISTRY entry like Calculator). This is what "Add web app" creates:
  // a site the person points at directly, upgraded with its real manifest
  // icon/name/color when that's fetchable. New type, zero changes to any
  // existing class — exactly what the base model was built to allow.
  class WebAppItem extends DesktopItem{
    constructor(opts){
      super(opts);
      this.type = "webapp";
      this.url = opts.url || "";
      this.manifestIcon = opts.manifestIcon || null;   // resolved absolute URL of the app's real icon, once found
      this.themeColor = opts.themeColor || null;        // from the manifest, if present
    }
  }
  const ITEM_CLASSES = { bookmark: BookmarkItem, folder: FolderItem, app: AppItem, webapp: WebAppItem };
  function createItem(type, opts){
    const Ctor = ITEM_CLASSES[type];
    if(!Ctor){ console.warn("on369: unknown item type, skipping:", type); return null; }
    return new Ctor(opts || {});
  }

  /* ---------- STORE ----------
     Unified async persistence. IndexedDB is the intended engine — each
     desktop item is its own record, so a single edit writes one row instead
     of rewriting the whole desktop as one JSON blob. But IndexedDB can throw
     on open() for file:// pages (opaque-origin SecurityError per spec, and
     this file is designed to be opened directly, not hosted), so every
     operation transparently falls back to a localStorage-backed equivalent
     with the exact same per-record shape if IndexedDB is unavailable OR
     fails partway through a session. Callers never need to know which
     engine is actually active. */
  const Store = (function(){
    const DB_NAME = "on369-db", DB_VERSION = 1;
    const ITEMS_STORE = "items", PREFS_STORE = "preferences", APPDATA_STORE = "appData";
    const FALLBACK_ITEMS_KEY = "on369.idbFallback.items.v1";
    const FALLBACK_PREFS_KEY = "on369.idbFallback.prefs.v1";
    const FALLBACK_APPDATA_KEY = "on369.idbFallback.appData.v1";

    let engine = null; // 'idb' | 'local'
    let dbPromise = null;

    function openDB(){
      if(dbPromise) return dbPromise;
      const attempt = new Promise((resolve, reject)=>{
        let req;
        try{ req = indexedDB.open(DB_NAME, DB_VERSION); }
        catch(err){ reject(err); return; }
        req.onupgradeneeded = (e)=>{
          const db = e.target.result;
          if(!db.objectStoreNames.contains(ITEMS_STORE)){
            db.createObjectStore(ITEMS_STORE, { keyPath:"id" }).createIndex("parentId", "parentId", { unique:false });
          }
          if(!db.objectStoreNames.contains(PREFS_STORE)){
            db.createObjectStore(PREFS_STORE, { keyPath:"key" });
          }
          if(!db.objectStoreNames.contains(APPDATA_STORE)){
            // key = "<appId>:<dataKey>" — namespaced so apps can't collide
            // with each other's data by using the same key name.
            db.createObjectStore(APPDATA_STORE, { keyPath:"key" });
          }
        };
        req.onsuccess = ()=> resolve(req.result);
        req.onerror = ()=> reject(req.error || new Error("IndexedDB open failed"));
        req.onblocked = ()=> reject(new Error("IndexedDB open blocked"));
      });
      // Defensive timeout: some browsers (Safari has documented cases) can
      // leave an open() request never firing any callback at all. Without
      // this, that would hang the whole app forever waiting on a promise
      // that never settles, instead of falling back to localStorage.
      const timeout = new Promise((_, reject)=>{
        setTimeout(()=> reject(new Error("IndexedDB open timed out")), 3000);
      });
      dbPromise = Promise.race([attempt, timeout]);
      return dbPromise;
    }

    async function detectEngine(){
      if(engine) return engine;
      if(typeof indexedDB === "undefined"){ engine = "local"; return engine; }
      try{ await openDB(); engine = "idb"; }
      catch(err){
        console.warn("on369: IndexedDB unavailable, using localStorage fallback:", err && err.message);
        engine = "local";
      }
      return engine;
    }

    function idbRun(storeName, mode, fn){
      return openDB().then(db=> new Promise((resolve,reject)=>{
        const tx = db.transaction(storeName, mode);
        const store = tx.objectStore(storeName);
        const result = fn(store);
        tx.oncomplete = ()=> resolve(result && result.__req ? result.__req.result : undefined);
        tx.onerror = ()=> reject(tx.error);
      }));
    }
    function idbGetAll(storeName){
      return openDB().then(db=> new Promise((resolve,reject)=>{
        const req = db.transaction(storeName,"readonly").objectStore(storeName).getAll();
        req.onsuccess = ()=> resolve(req.result);
        req.onerror = ()=> reject(req.error);
      }));
    }
    function idbGetOne(storeName, key){
      return openDB().then(db=> new Promise((resolve,reject)=>{
        const req = db.transaction(storeName,"readonly").objectStore(storeName).get(key);
        req.onsuccess = ()=> resolve(req.result);
        req.onerror = ()=> reject(req.error);
      }));
    }
    function idbPutMany(storeName, records){
      if(records.length===0) return Promise.resolve();
      return idbRun(storeName, "readwrite", store=>{ records.forEach(r=>store.put(r)); });
    }
    function idbDeleteMany(storeName, ids){
      if(ids.length===0) return Promise.resolve();
      return idbRun(storeName, "readwrite", store=>{ ids.forEach(id=>store.delete(id)); });
    }

    function localGetAll(key){
      try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : []; }
      catch(e){ return []; }
    }
    function localPutMany(key, keyPath, records){
      const all = localGetAll(key);
      const map = new Map(all.map(r=>[r[keyPath], r]));
      records.forEach(r=> map.set(r[keyPath], r));
      try{ localStorage.setItem(key, JSON.stringify(Array.from(map.values()))); }
      catch(e){ console.warn("on369: fallback store write failed", e); }
    }
    function localDeleteMany(key, keyPath, ids){
      const idSet = new Set(ids);
      const all = localGetAll(key).filter(r=> !idSet.has(r[keyPath]));
      try{ localStorage.setItem(key, JSON.stringify(all)); }
      catch(e){ console.warn("on369: fallback store write failed", e); }
    }

    async function withFallback(idbFn, localFn){
      await detectEngine();
      if(engine === "idb"){
        try{ return await idbFn(); }
        catch(err){
          console.warn("on369: IndexedDB operation failed mid-session, switching to localStorage fallback:", err);
          engine = "local";
          return localFn();
        }
      }
      return localFn();
    }

    return {
      init: detectEngine,
      currentEngine: ()=> engine,
      getAllItems: ()=> withFallback(()=>idbGetAll(ITEMS_STORE), ()=>localGetAll(FALLBACK_ITEMS_KEY)),
      putItems: (items)=> withFallback(()=>idbPutMany(ITEMS_STORE, items), ()=>localPutMany(FALLBACK_ITEMS_KEY,"id",items)),
      deleteItems: (ids)=> withFallback(()=>idbDeleteMany(ITEMS_STORE, ids), ()=>localDeleteMany(FALLBACK_ITEMS_KEY,"id",ids)),
      getAllPrefs: ()=> withFallback(()=>idbGetAll(PREFS_STORE), ()=>localGetAll(FALLBACK_PREFS_KEY)),
      putPrefs: (entries)=> withFallback(()=>idbPutMany(PREFS_STORE, entries), ()=>localPutMany(FALLBACK_PREFS_KEY,"key",entries)),
      // Namespaced per-app data — value can be anything JSON-serializable
      // (a single setting or a whole array like Todo's task list).
      getAppData: (appId, key)=> withFallback(
        async ()=>{ const rec = await idbGetOne(APPDATA_STORE, `${appId}:${key}`); return rec ? rec.value : null; },
        ()=>{ const rec = localGetAll(FALLBACK_APPDATA_KEY).find(r=>r.key===`${appId}:${key}`); return rec ? rec.value : null; }
      ),
      setAppData: (appId, key, value)=> withFallback(
        ()=> idbPutMany(APPDATA_STORE, [{ key:`${appId}:${key}`, value }]),
        ()=> localPutMany(FALLBACK_APPDATA_KEY, "key", [{ key:`${appId}:${key}`, value }])
      )
    };
  })();

  function seedState(){
    return {
      theme: "verdant",
      wallpaper: "dots",
      searchEngine: "google",
      iconScale: 1,
      builtinAppsSeeded: true,
      defaultThemeMigrated: true,
      verdantDefaultMigrated: true,
      icons: [
        { id: uid(), type:"app", appId:"calculator", label:"Calculator", color: COLORS[5], x:0, y:0, parentId:null },
        { id: uid(), type:"app", appId:"todo", label:"Todo", color: COLORS[2], x:1, y:0, parentId:null },
        { id: uid(), type:"folder", label:"Getting Started", color: COLORS[1], x:2, y:0, parentId:null },
        { id: uid(), type:"webapp", label:"Pencraft Notes", url:"https://pencraft.on369.top", color: COLORS[4], x:3, y:0, parentId:null },
        { id: uid(), type:"webapp", label:"Beartly UI Builder", url:"https://beartly.on369.top", color: COLORS[0], x:0, y:1, parentId:null },
        { id: uid(), type:"folder", label:"Read Later", color: COLORS[3], x:1, y:1, parentId:null }
      ]
    };
  }

  // In-memory state is the single source of truth for rendering — every
  // existing read (childrenOf, glyphFor, render, search, drag/drop, etc.)
  // keeps working completely unchanged against this synchronous object.
  // Only persistence became async; reads did not.
  let state = { theme:"verdant", wallpaper:"dots", searchEngine:"google", iconScale:1, builtinAppsSeeded:false, defaultThemeMigrated:false, verdantDefaultMigrated:false, icons: [] };
  let currentFolderId = null; // null = root desktop
  let folderStack = []; // ids of ancestor folders visited to reach currentFolderId, for the Back button
  let multiSelectMode = false; // when true, tapping/clicking an icon toggles its selection instead of opening/replacing it

  // What's currently believed to be persisted, keyed by item id, so save()
  // can diff and write only what actually changed instead of the whole
  // desktop every time.
  let persistedSnapshot = new Map();
  function snapshotBody(item){
    const { modifiedAt, ...rest } = item;
    return JSON.stringify(rest);
  }

  async function persistPrefs(){
    try{
      await Store.putPrefs([
        { key:"theme", value: state.theme },
        { key:"wallpaper", value: state.wallpaper },
        { key:"searchEngine", value: state.searchEngine },
        { key:"iconScale", value: state.iconScale },
        { key:"builtinAppsSeeded", value: state.builtinAppsSeeded },
        { key:"defaultThemeMigrated", value: state.defaultThemeMigrated },
        { key:"verdantDefaultMigrated", value: state.verdantDefaultMigrated }
      ]);
    }catch(e){ console.warn("on369: preference save failed", e); }
  }

  // Fire-and-forget from every existing call site (save(); with no await) —
  // the in-memory state is already correct by the time this runs, so
  // rendering never waits on persistence. Errors are caught internally.
  async function save(){
    const currentIds = new Set();
    const toPut = [];
    state.icons.forEach(item=>{
      currentIds.add(item.id);
      const body = snapshotBody(item);
      if(persistedSnapshot.get(item.id) !== body){
        item.modifiedAt = Date.now();
        toPut.push(item);
      }
    });
    const toDeleteIds = [];
    persistedSnapshot.forEach((_, id)=>{ if(!currentIds.has(id)) toDeleteIds.push(id); });

    try{
      if(toPut.length) await Store.putItems(toPut);
      if(toDeleteIds.length) await Store.deleteItems(toDeleteIds);
      toPut.forEach(item=> persistedSnapshot.set(item.id, snapshotBody(item)));
      toDeleteIds.forEach(id=> persistedSnapshot.delete(id));
    }catch(e){
      console.warn("on369: item save failed", e);
    }
    await persistPrefs();
  }

  function applySeedInto(targetState){
    const seed = seedState();
    targetState.icons = seed.icons.map(raw => createItem(raw.type, raw)).filter(Boolean);
    targetState.theme = seed.theme;
    targetState.wallpaper = seed.wallpaper;
    targetState.searchEngine = seed.searchEngine;
    targetState.iconScale = seed.iconScale;
    targetState.builtinAppsSeeded = seed.builtinAppsSeeded;
    targetState.defaultThemeMigrated = seed.defaultThemeMigrated;
    targetState.verdantDefaultMigrated = seed.verdantDefaultMigrated;
  }

  // One-time migration: guarantee Calculator + Todo are on the desktop even
  // for pre-existing saved state (from before these apps existed). Runs
  // once — after that, deleting one is a real, respected choice rather than
  // getting re-added on every reload.
  function ensureBuiltinApps(){
    if(state.builtinAppsSeeded) return;
    const existingAppIds = new Set(state.icons.filter(i=>i.type==="app").map(i=>i.appId));
    const wanted = [
      { appId:"calculator", label:"Calculator", color: COLORS[5] },
      { appId:"todo", label:"Todo", color: COLORS[2] }
    ];
    wanted.forEach(w=>{
      if(!existingAppIds.has(w.appId)){
        const slot = nextFreeSlot(null);
        state.icons.push(createItem("app", { appId:w.appId, label:w.label, color:w.color, x:slot.x, y:slot.y, parentId:null }));
      }
    });
    state.builtinAppsSeeded = true;
    // No save() here — loadAndInit() does a single save() after all
    // migrations run, so this and ensureDefaultTheme() never race each
    // other with overlapping async writes against a still-stale snapshot.
  }

  // One-time default-theme migration: daylight is now the app default.
  // Existing saved sessions get switched once; after that, an explicit
  // theme choice (including switching back to noctis) always sticks.
  function ensureDefaultTheme(){
    if(state.defaultThemeMigrated) return;
    state.theme = "daylight";
    state.defaultThemeMigrated = true;
  }

  // One-time default-theme migration #2: verdant is now the app default
  // (previously daylight). Uses its own flag rather than reusing
  // defaultThemeMigrated above, so this runs exactly once more for every
  // session regardless of whether the daylight migration already fired —
  // after it runs, an explicit theme choice always sticks, same as above.
  function ensureVerdantDefault(){
    if(state.verdantDefaultMigrated) return;
    state.theme = "verdant";
    state.verdantDefaultMigrated = true;
  }

  // Async bootstrap: open the store, migrate the old single-blob format in
  // if this is the first run under the new architecture (or seed fresh if
  // there's nothing at all), then run the same built-in-app / theme
  // migrations as before. Everything that depends on state.icons being
  // populated (render, applyAppearance) waits on this promise before running.
  async function loadAndInit(){
    await Store.init();
    const [existingItems, existingPrefs] = await Promise.all([Store.getAllItems(), Store.getAllPrefs()]);

    if(existingItems.length === 0 && existingPrefs.length === 0){
      // Nothing in the new store yet. This data (seeded or migrated) has
      // never actually been written anywhere — persistedSnapshot stays
      // empty here on purpose, so the save() below correctly treats every
      // item as new and writes all of it.
      let legacyRaw = null;
      try{ legacyRaw = localStorage.getItem(STORAGE_KEY); }catch(e){}
      if(legacyRaw){
        try{
          const legacy = JSON.parse(legacyRaw);
          state.icons = (legacy.icons || []).map(raw => createItem(raw.type, raw)).filter(Boolean);
          state.theme = legacy.theme || "daylight";
          state.wallpaper = legacy.wallpaper || "dots";
          state.searchEngine = legacy.searchEngine || "google";
          state.builtinAppsSeeded = !!legacy.builtinAppsSeeded;
          state.defaultThemeMigrated = !!legacy.defaultThemeMigrated;
          state.verdantDefaultMigrated = !!legacy.verdantDefaultMigrated;
        }catch(e){
          console.warn("on369: legacy state migration failed, reseeding", e);
          applySeedInto(state);
        }
      }else{
        applySeedInto(state);
      }
    }else{
      // This data came FROM storage — it's already persisted, so snapshot
      // it immediately. Anything ensureBuiltinApps()/ensureDefaultTheme()
      // add on top of this will correctly show up as new in save().
      state.icons = existingItems.map(raw => createItem(raw.type, raw)).filter(Boolean);
      state.icons.forEach(item=> persistedSnapshot.set(item.id, snapshotBody(item)));
      const prefsMap = {};
      existingPrefs.forEach(p=> prefsMap[p.key] = p.value);
      if("theme" in prefsMap) state.theme = prefsMap.theme;
      if("wallpaper" in prefsMap) state.wallpaper = prefsMap.wallpaper;
      if("searchEngine" in prefsMap) state.searchEngine = prefsMap.searchEngine;
      if("iconScale" in prefsMap && typeof prefsMap.iconScale === "number") state.iconScale = prefsMap.iconScale;
      state.builtinAppsSeeded = !!prefsMap.builtinAppsSeeded;
      state.defaultThemeMigrated = !!prefsMap.defaultThemeMigrated;
      state.verdantDefaultMigrated = !!prefsMap.verdantDefaultMigrated;
    }

    if(!ENGINES[state.searchEngine]) state.searchEngine = "google";

    ensureBuiltinApps();
    ensureDefaultTheme();
    ensureVerdantDefault();
    await save(); // writes whatever save() finds new/changed against persistedSnapshot above
  }

  /* ============ DOM REFS ============ */
  const gridLayer = document.getElementById("gridLayer");
  const desktop = document.getElementById("desktop");
  const rubberband = document.getElementById("rubberband");
  const emptyHint = document.getElementById("emptyHint");
  const statusEl = document.getElementById("status");
  const folderOverlay = document.getElementById("folderOverlay");
  const folderBody = document.getElementById("folderBody");
  const folderTitle = document.getElementById("folderTitle");
  const windowLayer = document.getElementById("windowLayer");
  const taskbar = document.getElementById("taskbar");

  // Combines the responsive breakpoint's base icon size with the user's
  // zoom preference, writing fully-resolved pixel values. Deliberately NOT
  // done via CSS calc(--base * var(--icon-scale)) on the --cell-w custom
  // property itself: unlike calc() on a standard property (which always
  // resolves to a computed pixel value), calc() chains through nested
  // custom properties aren't guaranteed to resolve when queried directly
  // via getComputedStyle — the safer, already-proven pattern here is JS
  // reading the plain (non-calc) -base values and doing the multiplication
  // itself, same as how --topbar-h/--safe-top are already handled.
  function applyIconScale(){
    const cs = getComputedStyle(document.documentElement);
    const baseW = parseFloat(cs.getPropertyValue("--cell-w-base")) || 104;
    const baseH = parseFloat(cs.getPropertyValue("--cell-h-base")) || 118;
    const baseIcon = parseFloat(cs.getPropertyValue("--icon-size-base")) || 56;
    const scale = state.iconScale || 1;
    document.documentElement.style.setProperty("--cell-w", (baseW*scale)+"px");
    document.documentElement.style.setProperty("--cell-h", (baseH*scale)+"px");
    document.documentElement.style.setProperty("--icon-size", (baseIcon*scale)+"px");
  }

  function getCellSize(){
    const cs = getComputedStyle(document.documentElement);
    return {
      w: parseFloat(cs.getPropertyValue("--cell-w")) || 104,
      h: parseFloat(cs.getPropertyValue("--cell-h")) || 118
    };
  }

  // Absolutely-positioned children align to their relative parent's PADDING
  // EDGE, which is the same point as the parent's top-left corner would be
  // with zero padding — CSS padding never actually offsets them. So the gap
  // below the fixed topbar/searchbar has to be a real pixel offset applied
  // to each icon's left/top here, not padding on #gridLayer.
  function getGridOffset(parentId){
    if(parentId !== null){
      return { top: 20, left: 20 }; // matches folderBody's visual inset
    }
    const cs = getComputedStyle(document.documentElement);
    const topbarH = parseFloat(cs.getPropertyValue("--topbar-h")) || 44;
    const searchH = parseFloat(cs.getPropertyValue("--searchbar-h")) || 58;
    const safeTop = parseFloat(cs.getPropertyValue("--safe-top")) || 0;
    const safeLeft = parseFloat(cs.getPropertyValue("--safe-left")) || 0;
    const isMobile = window.innerWidth <= 640;
    return {
      top: topbarH + safeTop + searchH + 22,
      left: (isMobile ? 12 : 24) + safeLeft
    };
  }

  const isCoarsePointer = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

  let selected = new Set();
  let activeCtxMenu = null;

  /* ============ THEME / WALLPAPER ============ */
  const THEMES = [
    { id:"noctis",   name:"Noctis",   bg:"#0c0e13", bg2:"#1b2033", accent:"#7c9fff" },
    { id:"daylight", name:"Daylight", bg:"#eef0f4", bg2:"#cfd6e8", accent:"#4f6fe0" },
    { id:"dune",     name:"Dune",     bg:"#201a14", bg2:"#3a2c1c", accent:"#d4a054" },
    { id:"graphite", name:"Graphite", bg:"#1b1e23", bg2:"#2c3038", accent:"#8fa0b8" },
    { id:"verdant",  name:"Verdant",  bg:"#0f1a14", bg2:"#1c3226", accent:"#6cc499" }
  ];

  const themeGrid = document.getElementById("themeGrid");
  THEMES.forEach(t=>{
    const card = document.createElement("div");
    card.className = "theme-card";
    card.dataset.theme = t.id;
    card.innerHTML = `<div class="theme-swatch" style="background:linear-gradient(135deg, ${t.bg}, ${t.bg2})"><span class="dot" style="background:${t.accent}"></span></div><span class="theme-name">${t.name}</span>`;
    card.addEventListener("click", ()=>{ state.theme = t.id; applyAppearance(); save(); });
    themeGrid.appendChild(card);
  });

  function applyAppearance(){
    document.documentElement.setAttribute("data-theme", state.theme);
    document.documentElement.setAttribute("data-wallpaper", state.wallpaper);
    document.querySelectorAll(".theme-card").forEach(s=>{
      s.classList.toggle("active", s.dataset.theme === state.theme);
    });
    document.querySelectorAll(".wp-swatch").forEach(s=>{
      s.classList.toggle("active", s.dataset.wp === state.wallpaper);
    });
  }

  document.getElementById("settingsBtn").addEventListener("click", (e)=>{
    e.stopPropagation();
    document.getElementById("settingsPop").classList.toggle("open");
  });
  document.querySelectorAll(".wp-swatch").forEach(s=>{
    s.addEventListener("click", ()=>{ state.wallpaper = s.dataset.wp; applyAppearance(); save(); });
  });
  document.addEventListener("click", (e)=>{
    const pop = document.getElementById("settingsPop");
    if(pop.classList.contains("open") && !pop.contains(e.target) && e.target.id !== "settingsBtn"){
      pop.classList.remove("open");
    }
  });

  /* ============ ICON SIZE ============ */
  const ICON_SCALE_MIN = 0.7, ICON_SCALE_MAX = 1.6;
  function setIconScale(newScale){
    state.iconScale = Math.round(Math.min(ICON_SCALE_MAX, Math.max(ICON_SCALE_MIN, newScale)) * 100) / 100;
    applyIconScale();
    updateIconSizeReadout();
    render();
    save();
  }
  function updateIconSizeReadout(){
    const el = document.getElementById("iconSizeReadout");
    if(el) el.textContent = Math.round(state.iconScale * 100) + "%";
  }
  document.getElementById("iconSizeDown").addEventListener("click", ()=> setIconScale(state.iconScale - 0.1));
  document.getElementById("iconSizeUp").addEventListener("click", ()=> setIconScale(state.iconScale + 0.1));

  // Ctrl/Cmd + scroll-wheel zoom on the desktop, matching the resize
  // convention most desktop OSes already use for this exact gesture.
  desktop.addEventListener("wheel", (e)=>{
    if(!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    setIconScale(state.iconScale + (e.deltaY < 0 ? 0.05 : -0.05));
  }, { passive:false });
  folderBody.addEventListener("wheel", (e)=>{
    if(!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    setIconScale(state.iconScale + (e.deltaY < 0 ? 0.05 : -0.05));
  }, { passive:false });

  /* ============ CLOCK ============ */
  function tickClock(){
    const now = new Date();
    const time = now.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    const date = now.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"});
    document.querySelector("#clock .time").textContent = time;
    document.querySelector("#clock .date").textContent = date;
  }
  tickClock();
  setInterval(tickClock, 15000);

  /* ============ ICON GLYPHS ============ */
  function folderSVG(color){
    return `<svg viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" fill="${color}" opacity="0.9"/><path d="M3 9h18" stroke="rgba(0,0,0,0.15)" stroke-width="1"/></svg>`;
  }
  function linkSVG(color){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l2-2a5 5 0 0 0-7.07-7.07l-1 1"></path><path d="M14 11a5 5 0 0 0-7.07 0l-2 2a5 5 0 0 0 7.07 7.07l1-1"></path></svg>`;
  }
  function calculatorSVG(color){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2.5"></rect><line x1="8" y1="6.5" x2="16" y2="6.5"></line><circle cx="8" cy="11.5" r="1" fill="${color}" stroke="none"></circle><circle cx="12" cy="11.5" r="1" fill="${color}" stroke="none"></circle><circle cx="16" cy="11.5" r="1" fill="${color}" stroke="none"></circle><circle cx="8" cy="15.5" r="1" fill="${color}" stroke="none"></circle><circle cx="12" cy="15.5" r="1" fill="${color}" stroke="none"></circle><circle cx="16" cy="15.5" r="1" fill="${color}" stroke="none"></circle><circle cx="8" cy="19" r="1" fill="${color}" stroke="none"></circle><circle cx="12" cy="19" r="1" fill="${color}" stroke="none"></circle><circle cx="16" cy="19" r="1" fill="${color}" stroke="none"></circle></svg>`;
  }
  function todoSVG(color){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="7" height="7" rx="1.5"></rect><path d="M5 7l1.3 1.3L8.5 5.8"></path><rect x="3" y="13.5" width="7" height="7" rx="1.5"></rect><path d="M5 17l1.3 1.3 2.2-2.5"></path><line x1="13" y1="7" x2="21" y2="7"></line><line x1="13" y1="17" x2="21" y2="17"></line></svg>`;
  }

  function faviconDomain(url){
    try{ return new URL(url).hostname; }
    catch(e){ return null; }
  }

  function domainLabel(url){
    const host = faviconDomain(url);
    if(!host) return "Untitled";
    const bare = host.replace(/^www\./, "");
    const core = bare.split(".")[0];
    return core.charAt(0).toUpperCase() + core.slice(1);
  }

  // Builds a chained onerror fallback across N image URLs, ending in the
  // generated SVG glyph if all of them fail. Generalizes what was previously
  // hand-written twice (bookmarks, and now webapps) into one place.
  function pictorialGlyphHTML(color, tierUrls){
    const fallback = linkSVG(color);
    const fallbackEscaped = fallback.replace(/`/g,"'").replace(/"/g,"&quot;");
    if(tierUrls.length === 0){
      return `<div class="glyph-wrap"><div class="icon-glyph" style="border-color:${color}55">${fallback}</div></div>`;
    }
    let onerrorChain = `this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:\`${fallbackEscaped}\`}).firstChild)`;
    for(let i = tierUrls.length - 1; i >= 1; i--){
      onerrorChain = `this.onerror=function(){${onerrorChain}};this.src='${tierUrls[i]}'`;
    }
    return `<div class="glyph-wrap"><div class="icon-glyph" style="border-color:${color}55">
      <img src="${tierUrls[0]}" alt="" onerror="${onerrorChain}">
    </div></div>`;
  }

  function glyphFor(item){
    if(item.type === "folder"){
      const count = childrenOf(item.id).length;
      const badge = count > 0 ? `<span class="count-badge">${count > 99 ? "99+" : count}</span>` : "";
      return `<div class="glyph-wrap"><div class="icon-glyph" style="background:${item.color}22;border-color:${item.color}55">${folderSVG(item.color)}</div>${badge}</div>`;
    }
    if(item.type === "app"){
      const app = AppManager.getMetadata(item.appId);
      const svg = app ? app.icon(item.color) : linkSVG(item.color);
      return `<div class="glyph-wrap"><div class="icon-glyph" style="background:${item.color}1a;border-color:${item.color}55">${svg}</div></div>`;
    }
    if(item.type === "webapp"){
      const domain = faviconDomain(item.url);
      const tiers = [];
      if(item.manifestIcon) tiers.push(item.manifestIcon); // the real app icon, when we found one
      if(domain){
        tiers.push(`https://icons.duckduckgo.com/ip3/${domain}.ico`);
        tiers.push(`https://www.google.com/s2/favicons?sz=128&domain=${domain}`);
      }
      return pictorialGlyphHTML(item.color, tiers);
    }
    const domain = faviconDomain(item.url);
    if(domain){
      // Three-tier pictorial fallback: DuckDuckGo's icon service errors cleanly on a
      // real miss (so onerror actually fires), Google's s2 service has broad coverage
      // but silently returns a generic placeholder instead of erroring, and our own
      // colored glyph is the guaranteed-to-render last resort.
      return pictorialGlyphHTML(item.color, [
        `https://icons.duckduckgo.com/ip3/${domain}.ico`,
        `https://www.google.com/s2/favicons?sz=128&domain=${domain}`
      ]);
    }
    return pictorialGlyphHTML(item.color, []);
  }

  /* ============ CONTEXT MENU ICONS ============
     Plain outline glyphs for menu chrome (as opposed to glyphFor() above,
     which renders each item's own colored desktop icon). Single shared
     stroke style (currentColor, so they inherit each row's text/danger
     color automatically) matching the search bar and icon-size buttons. */
  const MENU_ICON_PATHS = {
    view: `<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle>`,
    zoomIn: `<circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path><path d="M11 8v6M8 11h6"></path>`,
    zoomOut: `<circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path><path d="M8 11h6"></path>`,
    reset: `<path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path>`,
    paste: `<rect x="4" y="5" width="16" height="16" rx="2"></rect><rect x="8" y="2.5" width="8" height="4" rx="1.2"></rect>`,
    folder: `<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"></path>`,
    bookmark: `<path d="M6 3h12a1 1 0 0 1 1 1v16l-7-4-7 4V4a1 1 0 0 1 1-1Z"></path>`,
    grid: `<rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect>`,
    globe: `<circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"></path>`,
    import: `<path d="M21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6"></path><path d="M7 9l5 5 5-5"></path><path d="M12 14V3"></path>`,
    export: `<path d="M21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6"></path><path d="M7 8l5-5 5 5"></path><path d="M12 3v11"></path>`,
    sort: `<path d="M4 6h16"></path><path d="M7 12h10"></path><path d="M10 18h4"></path>`,
    arrange: `<rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path><path d="M9 3v18"></path><path d="M15 3v18"></path>`,
    back: `<path d="M19 12H5"></path><path d="m11 18-6-6 6-6"></path>`,
    openLink: `<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path>`,
    rename: `<path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>`,
    editUrl: `<path d="M9 17H7A5 5 0 0 1 7 7h2"></path><path d="M15 7h2a5 5 0 1 1 0 10h-2"></path><path d="M8 12h8"></path>`,
    copy: `<rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>`,
    move: `<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"></path><path d="M8 13l3 3 3-3"></path><path d="M11 16v-5"></path>`,
    cut: `<circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M8.5 8.5 19 19"></path><path d="M8.5 15.5 19 5"></path>`,
    delete: `<path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path>`,
    chevron: `<path d="m9 6 6 6-6 6"></path>`,
    desktop: `<rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path>`,
    clock: `<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path>`,
    tag: `<path d="M20.6 12.6 12 21.2a2 2 0 0 1-2.8 0l-6.4-6.4a2 2 0 0 1 0-2.8L11.4 3.4A2 2 0 0 1 12.8 3H19a2 2 0 0 1 2 2v6.2a2 2 0 0 1-.4 1.4Z"></path><circle cx="15" cy="9" r="1.5"></circle>`,
    refresh: `<path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M3 16v5h5"></path><path d="M16 3h5v5"></path>`,
    check: `<rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="m8 12 3 3 6-6"></path>`
  };
  function menuIcon(name){
    const d = MENU_ICON_PATHS[name];
    if(!d) return "";
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  }

  /* ============ GRID PLACEMENT ============ */
  function childrenOf(parentId){
    return state.icons.filter(i => i.parentId === parentId);
  }

  function occupied(parentId, x, y, excludeId){
    return childrenOf(parentId).some(i => i.id !== excludeId && i.x === x && i.y === y);
  }

  function maxColsFor(parentId){
    const cell = getCellSize();
    if(parentId === null){
      return Math.max(3, Math.floor((window.innerWidth - 48) / cell.w));
    }
    // Folder panel is a fixed, narrower width (max-width: 560px, minus padding).
    return Math.max(2, Math.floor(520 / cell.w));
  }

  function nextFreeSlot(parentId){
    const maxCols = maxColsFor(parentId);
    for(let y=0; y<500; y++){

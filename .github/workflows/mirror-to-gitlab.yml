name: Mirror to GitLab
on:
  push:
    branches: ['*']
    tags: ['*']

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git push --force https://oauth2:${GITLAB_TOKEN}@gitlab.com/Kkarei/on369.git refs/remotes/origin/*:refs/heads/*
          git push --force --tags https://oauth2:${GITLAB_TOKEN}@gitlab.com/Kkarei/on369.git
